];
const TRACKS=[
  {id:"sign", name:"署名鍵", steps:[1,2,3,4,5,6,11,12]},
  {id:"data", name:"暗号鍵", steps:[1,2,7,8,9,10,11,12]}
];
const ALL={t:"全体像",
  b:"鍵の付け替えは、新しい世代を作り、使う鍵を切り替え、古い世代を役目を絞って残し、最後に消す。署名鍵は、新しい公開鍵を先に配ってから切り替え、古い秘密鍵は <code>CKA_SIGN</code> を FALSE に。暗号鍵は、新しいデータを新しい KEK で包み、古い KEK は <code>CKA_WRAP</code> を FALSE にして、データ鍵を包み直す。アプリは鍵をラベル（世代入り）で引くので、設定を替えるだけで切り替わる。",
  c:[C("// 全手順を examples/s2-rotation で CI 確認"),C("// 署名は openssl でも検証"),C("// 根拠：Base v2.40「Key management functions」"),C("//   「Object management functions」C_SetAttributeValue")]};

const svgEl=document.getElementById('svg');
function inRange(r,n){return r.split(' ').some(p=>{const [a,b]=p.split('-').map(Number);return n>=a&&n<=(b||a)})}
function update(cur,all){
  const k=all?[]:STEPS[cur-1].k;
  svgEl.querySelectorAll('[data-k]').forEach(g=>g.classList.toggle('lit',k.includes(g.dataset.k)));
  svgEl.querySelectorAll('.alt[data-r]').forEach(g=>g.classList.toggle('shown',all?g.dataset.all==='1':inRange(g.dataset.r,cur)));
}
runSteps({steps:STEPS, all:ALL, tracks:TRACKS, onShow:update});
</script>
