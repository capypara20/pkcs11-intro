<script>
const C=code;
const STEPS=[
  {t:"ログインなしで読める情報",
   b:"第1章で <code>C_Initialize</code> したら、まずはつなぐ相手を確かめる。<code>C_GetInfo</code>（ライブラリ）、<code>C_GetSlotList</code> と <code>C_GetSlotInfo</code>（スロット）、<code>C_GetTokenInfo</code>（トークン）は、セッションもログインも要らない。スロットはトークンを差す口で、トークンが入っていないスロットもある。",
   c:["let info = lib.get_library_info()?; "+C("// C_GetInfo"),"let all = lib.get_all_slots()?; "+C("// C_GetSlotList(FALSE)"),"let with_token = lib.get_slots_with_token()?; "+C("// C_GetSlotList(TRUE)"),C("// with_token.len() <= all.len()")],
   k:["lib","tok","L2"]},
  {t:"つなぐトークンを選ぶ",
   b:"スロット番号は固定とは限らない（トークン次第）ので、アプリに番号を書き込まない。初期化済みのトークンの中から、ラベルで探す。同じラベルのトークンが2つありうる環境なら、シリアル番号でも見分ける。",
   c:["for slot in lib.get_slots_with_initialized_token()? {","    if lib.get_token_info(slot)?.label() == \"demo\" {","        return Ok(slot); "+C("// 番号ではなくラベルで"),"    }","}"],
   k:["tok","pick","L2"]},
  {t:"トークンの状態を読む",
   b:"<code>C_GetTokenInfo</code> のフラグで、トークンが初期化済みか（<code>CKF_TOKEN_INITIALIZED</code>）、User PIN があるか（<code>CKF_USER_PIN_INITIALIZED</code>）、鍵を使うのにログインが要るか（<code>CKF_LOGIN_REQUIRED</code>）、乱数を作れるか（<code>CKF_RNG</code>）がわかる。PIN を間違え続けたときの印もここに出る。どのフラグが立つかはトークン次第。",
   c:["let t = lib.get_token_info(slot)?; "+C("// C_GetTokenInfo"),"t.token_initialized() && t.user_pin_initialized()","    && t.login_required() && t.rng() "+C("// demo では true"),"t.min_pin_length() <= t.max_pin_length()"],
   k:["tok","L3"]},
  {t:"セッションを開く",
   b:"トークンとのやりとりは、すべてセッションの上で行う。<code>C_OpenSession</code> で R/W（読み書き）か R/O（読むだけ）かを選ぶ。開いたばかりのセッションはログインなしの状態（<code>RwPublic</code> / <code>RoPublic</code>）。1つのアプリが同じトークンにいくつもセッションを開ける。",
   c:["let rw = lib.open_rw_session(slot)?; "+C("// A：RwPublic"),"let ro = lib.open_ro_session(slot)?; "+C("// B：RoPublic"),"rw.get_session_info()?.read_write() "+C("// true")],
   k:["ses","L4","st-ROP","st-RWP"]},
  {t:"ログインはトークンに1回",
   b:"ログインはセッションごとではなく、トークンに対して1回。A でログインすると、同じトークンの B も User の状態（<code>RoUser</code>）になり、B からもう一度ログインすると <code>CKR_USER_ALREADY_LOGGED_IN</code>。ログインのあとに開いた C も User の状態から始まる。セッションの状態は、R/O か R/W かと、だれがログインしているかで5つ。SO のログインは第1章。",
   c:["rw.login(UserType::User, Some(&pin))?; "+C("// C_Login"),"(state(&ro)?, state(&rw)?) "+C("// (RoUser, RwUser)"),"ro.login(UserType::User, Some(&pin))",C("// → CKR_USER_ALREADY_LOGGED_IN"),"state(&lib.open_ro_session(slot)?)? "+C("// RoUser")],
   k:["ses","tok","L5","st-ROU","st-RWU"]},
  {t:"R/O セッションでできること",
   b:"R/O セッションでも、鍵を使う操作（署名・暗号化）、乱数、検索、セッションオブジェクト（第3章）の作成はできる。できないのは、トークンに残る変更（トークンオブジェクトの作成・変更・削除）で、<code>CKR_SESSION_READ_ONLY</code> になる。鍵を使うだけのアプリなら R/O で足りる。",
   c:["ro.find_objects(&[label(\"ch2-key\")])? "+C("// 見つかる"),"ro.encrypt(&Mechanism::AesEcb, session_key, &block)?;","ro.generate_random_vec(16)?;","ro.destroy_object(stored)",C("// → CKR_SESSION_READ_ONLY")],
   k:["ses","L6","st-ROU"]},
  {t:"最後のセッションを閉じるとログアウト",
   b:"ログインは、このアプリがそのトークンに開いたセッションが1つでも残っている間は続く。最後のセッションを閉じるとログアウトされ、次に開いたセッションはログインなしから始まる。cryptoki の <code>Session</code> は drop でも閉じるので、ログインしたセッションを先に捨てないようにする。",
   c:["rw.close()?; "+C("// B が残っている"),"state(&ro)?; "+C("// RoUser のまま"),"ro.close()?; "+C("// 最後の1つ → ログアウト"),"state(&lib.open_rw_session(slot)?)? "+C("// RwPublic")],
   k:["ses","tok","L7","st-RWP"]},
  {t:"スレッドごとにセッションを開く",
   b:"<code>CKF_OS_LOCKING_OK</code> で初期化したライブラリは、複数のスレッドから使える。セッションはスレッドごとに開く。cryptoki の <code>Session</code> は別のスレッドへ渡せる（<code>Send</code>）が、2つのスレッドから同時には使えない（<code>Sync</code> でない）。ログインはスレッドをまたいで共有され、スレッドで開いたセッションも User の状態から始まる。",
   c:["let lib = lib.clone(); "+C("// 中身は Arc で共有"),"thread::spawn(move || {","    let s = lib.open_ro_session(slot)?; "+C("// RoUser"),"    s.generate_random_vec(16)","});"],
   k:["app","lib","ses","st-ROU"]},
  {t:"後片付け",
   b:"終えるときは <code>C_Logout</code> → <code>C_CloseSession</code> → <code>C_Finalize</code> の順。<code>C_Logout</code> は、このアプリがそのトークンに開いたセッションすべてをログインなしに戻す。<code>C_Finalize</code> の前に、ライブラリを使うスレッドを終わらせておく。",
   c:["let o = lib.open_ro_session(slot)?;","s.logout()?; "+C("// C_Logout"),"(state(&s)?, state(&o)?) "+C("// (RwPublic, RoPublic)"),"s.close()?; lib.finalize()?;"],
   k:["ses","lib","L7","L8","st-ROP","st-RWP"]}
];
const ALL={t:"全体像",
  b:"ログインなしで読める情報からつなぐトークンをラベルで選び、<code>C_OpenSession</code> で R/O か R/W のセッションを開き、<code>C_Login</code> で1回ログインする。ログインはトークンに対して1つで、このアプリのセッションすべてに効き、最後のセッションを閉じるか <code>C_Logout</code> するまで続く。R/O ではトークンに残る変更だけができない。",
  c:[C("// 挙動は examples/02-connect で CI 確認"),C("// 根拠：Base v2.40「Slot and token management functions」"),C("//   「Session management functions」「Sessions」")]};

const svgEl=document.getElementById('svg');
function inRange(r,n){return r.split(' ').some(p=>{const [a,b]=p.split('-').map(Number);return n>=a&&n<=(b||a)})}
function update(cur,all){
  const k=all?[]:STEPS[cur-1].k;
  svgEl.querySelectorAll('[data-k]').forEach(g=>g.classList.toggle('lit',k.includes(g.dataset.k)));
  svgEl.querySelectorAll('.alt[data-r]').forEach(g=>g.classList.toggle('shown',all?g.dataset.all==='1':inRange(g.dataset.r,cur)));
}
runSteps({steps:STEPS, all:ALL, onShow:update});
</script>
