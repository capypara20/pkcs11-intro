    <g data-only="1"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="512" y="376" font-size="13" font-weight="700">復号は逆向き</text>
      <text x="512" y="402" font-size="12.5" class="mono">C_DecryptInit（同じメカニズム・同じパラメータ・鍵）→ C_Decrypt（暗号文 → 平文）</text><text x="512" y="428" font-size="12" class="mut">cryptoki の encrypt / decrypt は、Init と本体を続けて呼ぶ</text></g>

    <!-- 2. 鍵を作る -->
    <g data-only="2"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="13" class="mono brass">C_GenerateKey(CKM_AES_KEY_GEN)</text>
      <text x="512" y="402" font-size="12" class="mono">CKA_VALUE_LEN = 32, CKA_ENCRYPT = TRUE, CKA_DECRYPT = TRUE,</text>
      <text x="512" y="422" font-size="12" class="mono">CKA_SENSITIVE = TRUE, CKA_EXTRACTABLE = FALSE</text>
      <text x="512" y="450" font-size="12" class="mono wr">CKA_ENCRYPT のない鍵で暗号化 → CKR_KEY_FUNCTION_NOT_PERMITTED</text></g>

    <!-- 3. 方式とパラメータ（鍵の欄の上に重ねる） -->
    <g data-only="3"><rect class="box" x="498" y="180" width="680" height="282" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="204" font-size="13" font-weight="700">メカニズムが方式を決め、方式ごとにパラメータが違う（使えるかはトークン次第）</text>
      <text x="512" y="228" font-size="11" class="mut">メカニズム</text><text x="690" y="228" font-size="11" class="mut">パラメータ</text><text x="890" y="228" font-size="11" class="mut">向き・不向き</text>
      <line x1="512" y1="236" x2="1164" y2="236" stroke="var(--line)"/><text x="512" y="256" font-size="12.5" class="mono cy">CKM_AES_ECB</text><text x="690" y="256" font-size="12">なし</text><text x="890" y="256" font-size="12" class="wr">避ける（同じ入力が同じ出力になり、模様が残る）</text><line x1="512" y1="266" x2="1164" y2="266" stroke="var(--line)"/><text x="512" y="286" font-size="12.5" class="mono cy">CKM_AES_CBC_PAD</text><text x="690" y="286" font-size="12">IV 16 バイト</text><text x="890" y="286" font-size="12" class="brass">注意（改ざんに気づかない。MAC と組み合わせる）</text><line x1="512" y1="296" x2="1164" y2="296" stroke="var(--line)"/><text x="512" y="316" font-size="12.5" class="mono cy">CKM_AES_CTR</text><text x="690" y="316" font-size="12">カウンタブロック 16 バイト</text><text x="890" y="316" font-size="12" class="brass">注意（改ざん検知なし。カウンタは使い回さない）</text><line x1="512" y1="326" x2="1164" y2="326" stroke="var(--line)"/><text x="512" y="346" font-size="12.5" class="mono cy">CKM_AES_GCM</text><text x="690" y="346" font-size="12">IV・付随データ・タグの長さ</text><text x="890" y="346" font-size="12" class="cy">向いている（暗号化と改ざん検知を一度に）</text><line x1="512" y1="356" x2="1164" y2="356" stroke="var(--line)"/><text x="512" y="376" font-size="12.5" class="mono cy">CKM_DES3_CBC_PAD</text><text x="690" y="376" font-size="12">IV 8 バイト</text><text x="890" y="376" font-size="12" class="wr">新しくは使わない（古い方式・ブロックが短い）</text><line x1="512" y1="386" x2="1164" y2="386" stroke="var(--line)"/><text x="512" y="406" font-size="12.5" class="mono cy">CKM_RSA_PKCS_OAEP</text><text x="690" y="406" font-size="12">ハッシュと MGF</text><text x="890" y="406" font-size="12" class="cy">向いている（公開鍵で暗号化するなら）</text><line x1="512" y1="416" x2="1164" y2="416" stroke="var(--line)"/><text x="512" y="436" font-size="12.5" class="mono cy">CKM_RSA_PKCS</text><text x="690" y="436" font-size="12">なし</text><text x="890" y="436" font-size="12" class="wr">新しくは使わない（古い詰め方・攻撃あり）</text></g>

    <!-- 4. ECB と CBC -->
    <g data-only="4"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--warn)"/>
      <text x="36" y="372" font-size="12">同じ 32 バイト（AAAA…）を暗号化</text>
      <text x="36" y="398" font-size="12" class="mono">ECB</text><rect x="80" y="385" width="80" height="22" rx="3" fill="var(--brass)"/><rect x="166" y="385" width="80" height="22" rx="3" fill="var(--brass)"/><text x="254" y="400" font-size="11.5" class="wr">同じ</text>
      <text x="36" y="428" font-size="12" class="mono">CBC</text><rect x="80" y="415" width="80" height="22" rx="3" fill="var(--brass)"/><rect x="166" y="415" width="80" height="22" rx="3" fill="var(--cipher)"/><text x="254" y="430" font-size="11.5" class="cy">違う</text>
      <text x="36" y="454" font-size="11.5" class="mut">ECB は平文の模様が残る</text></g>

    <!-- 5. IV -->
    <g data-only="5"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--cipher)"/>
      <text x="36" y="374" font-size="12" class="wr">同じ IV → 同じ暗号文</text><text x="36" y="396" font-size="11.5" class="mut">（同じ平文を送ったとばれる）</text><text x="36" y="418" font-size="12" class="cy">IV を毎回変える → 違う暗号文</text><text x="36" y="440" font-size="11.5" class="mut">IV は秘密ではない。暗号文と一緒に送る</text></g>

    <!-- 6. パディング -->
    <g data-only="6"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="13" font-weight="700">ブロック暗号は 16 バイト単位</text>
      <text x="512" y="402" font-size="12.5" class="mono wr">CKM_AES_CBC に 9 バイト → CKR_DATA_LEN_RANGE（16 の倍数だけ）</text><text x="512" y="426" font-size="12.5" class="mono cy">CKM_AES_CBC_PAD → 16 バイトに埋めてから暗号化し、復号で取り除く</text><text x="512" y="450" font-size="11.5" class="mut">埋め方は PKCS #7 と同じ（足りないバイト数の値で埋める）</text></g>

    <!-- 7. CBC は改ざんに気づかない -->
    <g data-only="7"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--warn)"/>
      <text x="36" y="374" font-size="12">IV を 1 ビット変えて復号すると</text><text x="36" y="396" font-size="13" class="mono wr">→ "iello hsm"</text><text x="36" y="418" font-size="12" class="wr">エラーにならず、黙って変わる</text><text x="36" y="440" font-size="11.5" class="mut">気づくには GCM か MAC（第7章）</text></g>

    <!-- 8. CTR -->
    <g data-only="8"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--warn)"/>
      <text x="36" y="374" font-size="12" class="cy">9 バイト → 9 バイト（埋めない）</text><text x="36" y="396" font-size="11.5" class="wr">1 ビット改ざん → 平文も黙って変わる</text><text x="36" y="418" font-size="11.5">同じカウンタで 2 回暗号化すると</text><text x="36" y="440" font-size="11.5" class="wr">平文どうしの XOR が漏れる</text>
      <rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="12.5" class="mono brass">CK_AES_CTR_PARAMS（カウンタのビット数＋カウンタブロック 16 バイト）</text>
      <text x="512" y="402" font-size="12">cryptoki 0.12 には AES-CTR の型がないので、仕様の構造体を自分で定義して渡す</text><text x="512" y="426" font-size="11.5" class="mut">ラッパーにないメカニズムも、仕様どおりのパラメータを渡せば使える</text></g>

    <!-- 9. GCM は改ざんを見つける -->
    <g data-only="9"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--cipher)"/>
      <text x="36" y="374" font-size="12" class="cy">暗号文を 1 ビット変える → 復号エラー</text><text x="36" y="396" font-size="12" class="cy">付随データを変える → 復号エラー</text><text x="36" y="418" font-size="11.5" class="mut">（返すエラーはトークン次第）</text><text x="36" y="440" font-size="12" class="wr">同じ鍵で IV を使い回さないこと</text></g>

    <!-- 10. DES と 3DES -->
    <g data-only="10"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--line)"/>
      <text x="36" y="374" font-size="12">ブロック 8 バイト（AES は 16）</text><text x="36" y="396" font-size="12">IV も 8 バイト</text><text x="36" y="418" font-size="12" class="cy">9 バイト → 16 バイト（8 × 2）</text><text x="36" y="440" font-size="11.5" class="mut">ECB なら 8 バイト単位で模様が残る</text>
      <rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--warn)"/>
      <text x="512" y="376" font-size="12" class="mono brass">C_GenerateKey(CKM_DES3_KEY_GEN) → CKK_DES3・24 バイト（CKM_DES2_KEY_GEN は 16 バイト）</text>
      <text x="512" y="400" font-size="11.5">鍵の長さは固定で CKA_VALUE_LEN は書かない。各バイトの最下位ビットはパリティ</text><text x="512" y="420" font-size="11.5">単一 DES（8 バイト）は短すぎて総当たりで破れる。使えるかもトークン次第</text><text x="512" y="440" font-size="11.5" class="wr">3DES もブロックが短い古い方式。既存のしくみとつなぐとき以外は AES を使う</text></g>

    <!-- 11. 分けて渡す -->
    <g data-only="11"><rect class="box" x="316" y="150" width="152" height="146" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="324" y="172" font-size="12" class="mono cy">① C_EncryptInit</text><text x="324" y="193" font-size="12" class="mono cy">② C_EncryptUpdate</text><text x="324" y="214" font-size="11" class="mut">　出力 0 バイトのことも</text><text x="324" y="235" font-size="12" class="mono cy">③ C_EncryptFinal</text><text x="324" y="256" font-size="11" class="mut">　残りを出す</text><text x="324" y="277" font-size="11">→ 一度に渡したときと同じ</text></g>

    <!-- 12. 公開鍵で暗号化 -->
    <g data-only="12"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="13" font-weight="700">暗号化は公開鍵（誰でも）、復号は秘密鍵（トークンの中だけ）</text>
      <text x="512" y="400" font-size="12">2048 ビット・SHA-1 なら 214 バイトまで。長いデータは AES で暗号化し、その AES 鍵を RSA で包む</text><text x="512" y="422" font-size="11.5" class="mono mut">公開鍵で復号 → CKR_KEY_FUNCTION_NOT_PERMITTED</text><text x="512" y="444" font-size="11.5" class="mut">OAEP で使えるハッシュはトークン次第。対応していなければ失敗する</text></g>

    <!-- 13. RSA PKCS#1 v1.5 -->
    <g data-only="13"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--warn)"/>
      <text x="512" y="376" font-size="13" font-weight="700">CKM_RSA_PKCS：乱数で埋めるだけの古い詰め方（PKCS #1 v1.5）</text>
      <text x="512" y="402" font-size="12">2048 ビットなら 245 バイトまで（256 − 11）。暗号文は 256 バイトで毎回違う</text><text x="512" y="424" font-size="12" class="wr">復号の失敗のしかたから平文を割り出す攻撃が知られている</text><text x="512" y="446" font-size="11.5" class="mut">新しく使うなら RSA-OAEP。古い相手とつなぐときだけ使う</text></g>

    <!-- 14. 包んで送る -->
    <g data-only="14"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="13" font-weight="700">受け取る側：秘密鍵で AES 鍵をほどき、データを復号する</text>
      <text x="512" y="402" font-size="12" class="mono">C_UnwrapKey(CKM_RSA_PKCS_OAEP, 秘密鍵, 包んだ鍵, AES 鍵のテンプレート) → AES 鍵</text><text x="512" y="424" font-size="12" class="mono">C_Decrypt(CKM_AES_CBC_PAD, AES 鍵, 暗号文) → 1000 バイト</text><text x="512" y="446" font-size="12" class="cy">AES 鍵の値は、アプリにもネットワークにも平文で出ない</text></g>
  </svg>

<script>

   c:["let m = Mechanism::AesCbcPad(iv);","let ct = s.encrypt(&m, key, data)?;","let pt = s.decrypt(&m, key, &ct)?; "+C("// pt == data")],

   k:["key","key2","pipe","ct"], v:"oaep"},
  {t:"RSA PKCS#1 v1.5 は古い詰め方",
   b:"<code>CKM_RSA_PKCS</code> は乱数で埋めるだけの古い方式。OAEP より長く暗号化できる（2048 ビットなら 245 バイト）が、復号の失敗のしかたから平文を割り出す攻撃が知られている。新しく使うなら OAEP、古い相手とつなぐときだけ使う。",
   c:["s.encrypt(&Mechanism::RsaPkcs, pub_h, data)?;",C("// 256 バイト。245 バイトまで（246 は失敗）")],
   k:["key","key2","pipe","ct"], v:"pkcs1"},
  {t:"長いデータは鍵ごと包んで送る",
   b:"RSA で直接暗号化できるのは短いデータだけ。長いデータは AES で暗号化し、その AES 鍵を相手の公開鍵で包む（<code>C_WrapKey</code>）。受け取る側は秘密鍵で AES 鍵をほどき（<code>C_UnwrapKey</code>）、データを復号する。包むには公開鍵に <code>CKA_WRAP</code>、ほどくには秘密鍵に <code>CKA_UNWRAP</code> が要り、既定値はトークン次第なので明示する。包む AES 鍵は <code>CKA_EXTRACTABLE</code> を TRUE にしておく。",
   c:["let body = s.encrypt(&Mechanism::AesCbcPad(iv), aes, &long)?;","let wk = s.wrap_key(&oaep, pub_h, aes)?; "+C("// 256 バイト"),C("// 受け取る側"),"let k = s.unwrap_key(&oaep, priv_h, &wk, &aes_template)?;","s.decrypt(&Mechanism::AesCbcPad(iv), k, &body)?; "+C("// 1000 バイト")],

const TRACKS=[
  {id:"sym", name:"共通鍵", steps:[1,3,2,4,5,6,7,8,9,10,11]},
  {id:"pub", name:"公開鍵", steps:[1,3,12,13,14]}
];
const ALL={t:"全体像",
  b:"暗号化は <code>C_EncryptInit</code> → <code>C_Encrypt</code>、復号は逆向き。方式はメカニズムで選び、IV などのパラメータを渡す。ECB は模様が残り、CBC と CTR は改ざんに気づかない。改ざんも見つけたいなら GCM。3DES と RSA PKCS#1 v1.5 は古い相手とつなぐときだけ。公開鍵で暗号化するなら RSA-OAEP、長いデータは AES 鍵を RSA で包んで送る。",
  c:[C("// この章の関数・メカニズムは v2.40 で定義済み"),C("// 挙動は examples/06-crypt で CI 確認"),C("// 根拠：Base v2.40「Encryption functions」「Decryption functions」")]};

const svgEl=document.getElementById('svg'), stageEl=document.getElementById('stage');
let cycle=null, step=1;
function setV(v){
  svgEl.dataset.v=v;
  svgEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));
}
function lightUp(){
  const ks=(step===0?[]:STEPS[step-1].k)||[];
  svgEl.querySelectorAll('[data-k]').forEach(g=>g.classList.toggle('lit',ks.includes(g.dataset.k)));
}
function stopCycle(){clearInterval(cycle);cycle=null}
svgEl.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{stopCycle();setV(c.dataset.v)});
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();stopCycle();setV(c.dataset.v)}});
});
runSteps({
  steps:STEPS, all:ALL, tracks:TRACKS,
  onShow:(cur,all)=>{
    stopCycle(); step=all?0:cur; lightUp();
    if(all)return;
    const st=STEPS[cur-1];
    if(st.v)setV(st.v);
    if(st.cycle){
      setV(st.cycle[0]); let i=0;
      cycle=setInterval(()=>{if(!stageEl.classList.contains('paused')){i=(i+1)%st.cycle.length;setV(st.cycle[i])}},3500);
    }
  }
});
</script>
