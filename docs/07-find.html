" font-size="12">古い ID（A1 01）で探す</text><text x="640" y="466" font-size="11.5" class="mono cy">0 件</text></g><g class="alt" data-r="8"><rect class="box" x="10" y="384" width="1180" height="88" rx="6" fill="var(--bg)" stroke="var(--line)"/><text x="24" y="406" font-size="13" font-weight="700">名前の付け方の例</text><text x="36" y="428" font-size="12">ラベルに用途と世代を入れる</text><text x="640" y="428" font-size="11.5" class="mono cy">orders-data-2026</text><text x="36" y="447" font-size="12">鍵ペアと証明書は同じ CKA_ID（公開鍵のハッシュなど）</text><text x="640" y="447" font-size="11.5" class="mono cy">SHA-1(公開鍵)</text><text x="36" y="466" font-size="12">作る前に同じラベルを探し、あれば作らない</text><text x="640" y="466" font-size="11.5" class="mono cy">アプリが確かめる</text></g><g class="alt" data-r="9"><rect class="box" x="10" y="384" width="1180" height="88" rx="6" fill="var(--bg)" stroke="var(--line)"/><text x="24" y="406" font-size="13" font-weight="700">検索は1つのセッションで1つずつ</text><text x="36" y="428" font-size="12">セッション A で検索の途中に、もう1つ C_FindObjectsInit</text><text x="640" y="428" font-size="11.5" class="mono wr">CKR_OPERATION_ACTIVE</text><text x="36" y="447" font-size="12">同じときに、セッション B で探す</text><text x="640" y="447" font-size="11.5" class="mono cy">7 件見つかる</text></g><g class="alt" data-r="10"><rect class="box" x="10" y="384" width="1180" height="88" rx="6" fill="var(--bg)" stroke="var(--line)"/><text x="24" y="406" font-size="13" font-weight="700">少しずつ取り出す</text><text x="36" y="428" font-size="12">C_FindObjects(最大 2 件) を繰り返す</text><text x="640" y="428" font-size="11.5" class="mono cy">2 + 2 + 2 + 1</text><text x="36" y="447" font-size="12">cryptoki</text><text x="640" y="447" font-size="11.5" class="mono cy">iter_objects_with_cache_size</text></g><g class="alt" data-r="11"><rect class="box" x="10" y="384" width="1180" height="88" rx="6" fill="var(--bg)" stroke="var(--line)"/><text x="24" y="406" font-size="13" font-weight="700">ほかのツールでの呼び方（PKCS#11 URI、RFC 7512）</text><text x="36" y="428" font-size="12">pkcs11:token=demo;object=orders-sign;type=private;id=%A1%19…</text><text x="820" y="428" font-size="11.5" class="mono cy"></text><text x="36" y="447" font-size="12">object= はラベル、id= は CKA_ID。ハンドルは入らない</text><text x="820" y="447" font-size="11.5" class="mono cy"></text><text x="36" y="466" font-size="12">v3.0 の CKA_UNIQUE_ID（変えられない一意の ID）</text><text x="820" y="466" font-size="11.5" class="mono cy">SoftHSM2 2.6 にはない</text></g>

<script>
const C=code;
const ALLC=["dpub","dpriv","epub","epriv","aold","anew"];
const STEPS=[
  {t:"鍵を指す3つの手がかり",
   b:"トークンの中の鍵を指すものは3つある。<b>ハンドル</b>は <code>C_FindObjects</code> などが返す番号で、その接続の中でしか意味がない。ログアウトすると非公開オブジェクトのハンドルは無効になり、SoftHSM2 では demo-key の秘密鍵が 3 から別の番号に変わった。保存して使い回すのは <b>CKA_LABEL</b>（人が読む名前）と <b>CKA_ID</b>（バイト列）のほう。",
   c:["let h = s.find_objects(&[label(\"demo-key\"), ...])?;",C("// ログアウト → ログインのあとは別の番号"),"s.get_attributes(h, &[AttributeType::Label,","    AttributeType::Id])?;"],
   hit:[], k:[]},
  {t:"C_FindObjects で探す",
   b:"探すときは、欲しい属性の値を並べたテンプレートを渡す。<code>C_FindObjectsInit</code> で始め、<code>C_FindObjects</code> で何件かずつ受け取り、<code>C_FindObjectsFinal</code> で終える。cryptoki の <code>find_objects</code> はこの3つをまとめて呼ぶ。空のテンプレートは「見えるもの全部」。",
   c:["let all = s.find_objects(&[])?;",C("// C_FindObjectsInit → C_FindObjects → C_FindObjectsFinal"),"all.len() "+C("// 6")],
   hit:ALLC, k:["f1","f2","f3"]},
  {t:"ログインしないと見えないもの",
   b:"ログインしていないと、非公開（<code>CKA_PRIVATE=TRUE</code>）のオブジェクトは見つからない。demo トークンでは公開鍵の1件だけが返る。ログアウトすると、非公開のセッションオブジェクトは消えてしまう（ログインし直しても戻らない）。セッションオブジェクトは、同じアプリの別のセッションからも見える。",
   c:["s.find_objects(&[])? "+C("// ログイン前：demo-key の公開鍵だけ"),"s.login(UserType::User, Some(&pin))?;","s.find_objects(&[label(\"demo-key\")])?.len() "+C("// 2")],
   hit:["dpub"], k:[]},
  {t:"ラベルは重複できる",
   b:"<code>CKA_LABEL</code> は人が読むための名前で、同じ名前の鍵をいくつでも作れる。エラーにはならない。同じラベルで探すと複数返り、どれが新しいかもわからない。名前が重ならないようにするのはアプリの役目。",
   c:["aes_key(&s, \"orders-data\")?;","aes_key(&s, \"orders-data\")?; "+C("// エラーにならない"),"s.find_objects(&[label(\"orders-data\")])? "+C("// 2 件")],
   hit:["aold","anew"], k:[]},
  {t:"条件を重ねて絞る",
   b:"テンプレートの属性は「すべて一致」で効く。種類（<code>CKA_CLASS</code>）や鍵の型（<code>CKA_KEY_TYPE</code>）を足すと絞れる。一致は値の完全一致だけで、前方一致はない。その種類にない属性で探しても、エラーではなく 0 件になる。",
   c:["s.find_objects(&[","    Attribute::Class(ObjectClass::PRIVATE_KEY),","    Attribute::KeyType(KeyType::EC),","])? "+C("// 1 件")],
   hit:["epriv"], k:[]},
  {t:"CKA_ID で鍵ペアを結ぶ",
   b:"鍵ペアを作るとき、公開鍵と秘密鍵に同じ <code>CKA_ID</code> を付けておくと、片方から相手を探せる。証明書にも同じ ID を付けるのが慣例（シナリオで扱う）。pkcs11-tool で <code>--id</code> なしに作った demo-key は ID が空で、この方法では結べない。",
   c:["generate_key_pair(&mech,","    &[..., Attribute::Id(vec![0xA1, 0x01])],","    &[..., Attribute::Id(vec![0xA1, 0x01])])?;","s.find_objects(&[Attribute::Id(id), class(PRIVATE_KEY)])?"],
   hit:["epub","epriv"], k:[]},
  {t:"ID を公開鍵から決める",
   b:"<code>CKA_ID</code> は後から付け替えられる。よく使うのは公開鍵のハッシュで、同じ鍵からはいつも同じ ID が決まる。ここでは <code>CKA_EC_POINT</code> の SHA-1（20 バイト）をトークンで計算し、<code>C_SetAttributeValue</code> で公開鍵と秘密鍵の両方に付けた。",
   c:["let id = s.digest(&Mechanism::Sha1, &ec_point)?;","for h in [ec_pub, ec_priv] {","    s.update_attributes(h, &[Attribute::Id(id.clone())])?;","}"],
   hit:["epub","epriv"], k:[]},
  {t:"名前の付け方の例",
   b:"ラベルには用途と世代を入れ（<code>orders-data-2026</code>）、鍵ペアと証明書は同じ <code>CKA_ID</code> で結ぶ。作る前に同じラベルを探し、あれば作らない。<code>CKA_LABEL</code> も後から変えられるので、古い世代の名前を付け直せる。",
   c:["s.update_attributes(old, &[label(\"orders-data-2025\")])?;","if s.find_objects(&[label(name)])?.is_empty() {","    aes_key(&s, name)?; "+C("// ないときだけ作る"),"}"],
   hit:["anew"], k:[]},
  {t:"検索は1つずつ",
   b:"1つのセッションで進められる検索は1つだけ。検索の途中でもう1つ始めると <code>CKR_OPERATION_ACTIVE</code>。cryptoki の <code>iter_objects</code> は、イテレータを捨てるまで検索が続く。別のセッションなら同時に探せる。",
   c:["let mut it = s.iter_objects(&[])?; "+C("// Init"),"it.next();","s.find_objects(&[]) "+C("// → CKR_OPERATION_ACTIVE"),"drop(it); "+C("// Final")],
   hit:[], k:["f1"], ng:true},
  {t:"少しずつ取り出す",
   b:"<code>C_FindObjects</code> は、一度に受け取る最大の件数を決めて何回も呼べる。オブジェクトがたくさんあるトークンでも、少しずつ処理できる。cryptoki では <code>iter_objects_with_cache_size</code> で件数を決める。",
   c:["let n = NonZeroUsize::new(2).unwrap();","for h in s.iter_objects_with_cache_size(&[], n)? {","    let h = h?; "+C("// 2 件ずつ C_FindObjects"),"}"],
   hit:ALLC.concat(["a27"]), k:["f2"]},
  {t:"ほかのツールでの呼び方",
   b:"OpenSSL や p11-kit などは、PKCS#11 URI（RFC 7512）で鍵を指す。<code>object=</code> がラベル、<code>id=</code> が <code>CKA_ID</code> で、ハンドルは入らない。ラベルと ID をきちんと決めておけば、ほかのツールからも同じ鍵を呼べる。v3.0 では変えられない一意の ID（<code>CKA_UNIQUE_ID</code>）も加わった（SoftHSM2 2.6 にはない）。",
   c:["pkcs11:token=demo;object=orders-sign;","    type=private;id=%A1%19%0B…"],
   hit:["epriv"], k:[]}
];
const ALL={t:"全体像",
  b:"保存して使い回す名前は <code>CKA_LABEL</code>（人が読む名前）と <code>CKA_ID</code>（鍵ペアと証明書を結ぶ値）。どちらも重複を止める仕組みはないので、アプリが決まりを作る。ハンドルはその場の番号で、ログアウトなどで変わる。探すときはテンプレートで条件を重ね、1つのセッションで1つずつ。",
  c:[C("// 挙動は examples/07-find で CI 確認（SoftHSM2 2.6.1）"),C("// 根拠：Base v2.40「Object management functions」"),C("//   C_FindObjectsInit / C_FindObjects / C_FindObjectsFinal")]};

const svgEl=document.getElementById('svg');
function inRange(r,n){return r.split(' ').some(p=>{const [a,b]=p.split('-').map(Number);return n>=a&&n<=(b||a)})}
function update(cur,all){
  const st=all?{k:[],hit:[]}:STEPS[cur-1];
  svgEl.querySelectorAll('[data-k]').forEach(g=>{const on=st.k.includes(g.dataset.k);g.classList.toggle('lit',on);g.classList.toggle('ng',on&&!!st.ng)});
  svgEl.querySelectorAll('.alt[data-r]').forEach(g=>g.classList.toggle('shown',all?g.dataset.all==='1':inRange(g.dataset.r,cur)));
  const searching=!all&&cur>=2;
  svgEl.querySelectorAll('.card').forEach(c=>{const h=st.hit.includes(c.dataset.c);c.classList.toggle('hit',h);c.classList.toggle('miss',searching&&!h)});
}
runSteps({steps:STEPS, all:ALL, onShow:update});
</script>
