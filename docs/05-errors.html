   b:"PKCS#11 の関数はすべて <code>CK_RV</code>（数値）を返す。0 が <code>CKR_OK</code>（成功）で、それ以外は失敗の理由。cryptoki は番号を名前に直し、失敗した関数の名前と組にして <code>Error::Pkcs11</code> として返す。",
   c:["Err(Error::Pkcs11(RvError::KeyFunctionNotPermitted,","    Function::SignInit))",C("// 表示: Function::SignInit: PKCS11 error: ...")],
   k:[], lit:{}},
  {t:"どの段階のエラーかで読む",
   b:"エラーは、どの段階で起きたかで読むと原因に近づきやすい。右の地図は、これまでの章で出てきたものを段階ごとに並べたもの。✓ は本サイトのサンプルで実際に返ることを確かめたもの、「仕様」は仕様書にあるが確かめていないもの。",
   c:[C("// ① ライブラリ → ② セッション → ③ ログイン"),C("// → ④ テンプレート → ⑤ 操作の開始 → ⑥ データ")],
   k:["lib","sess","login","tpl","init","data"], lit:{}},
  {t:"① ライブラリ",
   b:"<code>C_Initialize</code> の前にほかの関数を呼ぶと <code>CKR_CRYPTOKI_NOT_INITIALIZED</code>、2回呼ぶと <code>CKR_CRYPTOKI_ALREADY_INITIALIZED</code>。ライブラリを複数の場所から使うときに起きやすい。",
   c:["lib.get_all_slots(); "+C("// 初期化前 → NOT_INITIALIZED"),"lib.initialize(args)?;","lib.initialize(args); "+C("// → ALREADY_INITIALIZED")],
   k:["lib"], lit:{CRYPTOKI_NOT_INITIALIZED:"on",CRYPTOKI_ALREADY_INITIALIZED:"on"}},
  {t:"② セッション",
   b:"R/O セッションでトークンオブジェクト（<code>CKA_TOKEN=TRUE</code>）を作ろうとすると <code>CKR_SESSION_READ_ONLY</code>。セッションオブジェクトなら R/O でも作れる。閉じたセッションを使うと <code>CKR_SESSION_HANDLE_INVALID</code>（cryptoki では型で防がれるので、サンプルでは確かめていない）。",
   c:["ro.generate_key(&mech, &[Attribute::Token(true), ...])",C("// → CKR_SESSION_READ_ONLY")],
   k:["sess"], lit:{SESSION_READ_ONLY:"on",SESSION_HANDLE_INVALID:"on"}},
  {t:"③ ログイン",
   b:"PIN が違えば <code>CKR_PIN_INCORRECT</code>。間違えるとトークン情報に「残り回数が少ない」の印（<code>CKF_USER_PIN_COUNT_LOW</code>）が立ち、間違えすぎると <code>CKR_PIN_LOCKED</code> になりうる。ログインせずに非公開オブジェクトを作れば <code>CKR_USER_NOT_LOGGED_IN</code>、2回ログインすれば <code>CKR_USER_ALREADY_LOGGED_IN</code>。",
   c:["s.login(UserType::User, Some(&wrong_pin))",C("// → CKR_PIN_INCORRECT"),"lib.get_token_info(slot)?.user_pin_count_low(); "+C("// true")],
   k:["login"], lit:{PIN_INCORRECT:"on",USER_NOT_LOGGED_IN:"on",USER_ALREADY_LOGGED_IN:"on",PIN_LOCKED:"on"}},
  {t:"④ テンプレート",
   b:"オブジェクトを作る・読む・変えるときのエラー。必要な属性がない、属性どうしが食い違う、その種類にない属性を書いた、値が許されない、変えられない属性を変えようとした、読めない属性を読もうとした。第1章・第2章で見たもの。",
   c:["s.generate_key(&Mechanism::AesKeyGen, &[/* 長さなし */])",C("// → CKR_TEMPLATE_INCOMPLETE"),"s.update_attributes(key, &[Attribute::Sensitive(false)])",C("// → CKR_ATTRIBUTE_READ_ONLY")],
   k:["tpl"], lit:{TEMPLATE_INCOMPLETE:"on",TEMPLATE_INCONSISTENT:"on",ATTRIBUTE_TYPE_INVALID:"on",ATTRIBUTE_VALUE_INVALID:"on",ATTRIBUTE_READ_ONLY:"on",ATTRIBUTE_SENSITIVE:"on"}},
  {t:"⑤ 操作の開始",
   b:"<code>C_SignInit</code> や <code>C_EncryptInit</code> は、メカニズムと鍵を確かめる。トークンにない方式なら <code>CKR_MECHANISM_INVALID</code>、鍵の用途が許していなければ <code>CKR_KEY_FUNCTION_NOT_PERMITTED</code>、同じセッションで別の操作が途中なら <code>CKR_OPERATION_ACTIVE</code>。第3章・第4章で見たもの。",
   c:["s.sign(&Mechanism::Sha256RsaPkcs, pub_h, data)",C("// → CKR_KEY_FUNCTION_NOT_PERMITTED")],
   k:["init"], lit:{MECHANISM_INVALID:"on",KEY_FUNCTION_NOT_PERMITTED:"on",KEY_TYPE_INCONSISTENT:"on",OPERATION_ACTIVE:"on"}},
  {t:"⑥ データ",
   b:"データを渡す段階のエラー。長さが合わなければ <code>CKR_DATA_LEN_RANGE</code>、検証で署名が合わなければ <code>CKR_SIGNATURE_INVALID</code>、署名の長さが違えば <code>CKR_SIGNATURE_LEN_RANGE</code>。出力先が小さければ <code>CKR_BUFFER_TOO_SMALL</code>（cryptoki は先に長さを聞くので、ふつうは出ない）。",
   c:["s.encrypt(&Mechanism::AesCbc(iv), key, b\"hello hsm\")",C("// → CKR_DATA_LEN_RANGE（16 の倍数でない）")],
   k:["data"], lit:{DATA_LEN_RANGE:"on",SIGNATURE_INVALID:"on",SIGNATURE_LEN_RANGE:"on",ENCRYPTED_DATA_INVALID:"on",BUFFER_TOO_SMALL:"on"}},
  {t:"エラーのあと、操作は終わる",
   b:"暗号化や署名の途中でエラーが返ると、その操作は終わっている。続きを呼ぶと <code>CKR_OPERATION_NOT_INITIALIZED</code> になるので、<code>Init</code> からやり直す。例外は <code>CKR_BUFFER_TOO_SMALL</code> で、このときは出力先を大きくして同じ呼び出しをやり直せる。",
   c:["s.encrypt_final() "+C("// → CKR_DATA_LEN_RANGE"),"s.encrypt_update(&block)",C("// → CKR_OPERATION_NOT_INITIALIZED"),"s.encrypt_init(&mech, key)?; "+C("// やり直し")],
   k:[], lit:{}},
  {t:"仕様どおりとは限らない",
   b:"同じ場面でも、トークンが仕様と違うエラーを返すことがある。SoftHSM2 では、仕様では別の名前が決まっている失敗の多くが <code>CKR_GENERAL_ERROR</code> になる。<code>CKR_PIN_INCORRECT</code> や <code>CKR_SIGNATURE_INVALID</code> のように意味がはっきりしたものだけ個別に扱い、それ以外は「失敗」としてまとめて扱うと、トークンを変えても壊れにくい。",
   c:["match e {","    Error::Pkcs11(RvError::PinIncorrect, _) =>","        /* PIN を聞き直す */,","    Error::Pkcs11(rv, f) => /* 失敗として記録 */,","    _ => /* 読み込みの失敗など */,","}"],
   k:[], lit:{}},
  {t:"番号でも読めるようにする",
   b:"ログには名前だけでなく番号と関数名も残す。番号は仕様書の表や、ほかのツールの出力（<code>0x000000A0</code> など）と突き合わせやすい。<code>0x80000000</code> 以上はベンダー独自のエラーで、意味はそのトークンの資料を見る。",
   c:["Rv::from(0xA0) "+C("// → Error(PinIncorrect)"),"Rv::from(0x8000_0001)",C("// → Error(VendorDefined(0x80000001))")],
   k:["lib","sess","login","tpl","init","data","uni"], lit:{}}
];
const ALL={t:"全体像",
  b:"戻り値はすべて <code>CK_RV</code>。どの段階（ライブラリ・セッション・ログイン・テンプレート・操作の開始・データ）で起きたかで読み、エラーのあとは <code>Init</code> からやり直す。トークンによって返すエラーは仕様と違うことがあるので、意味のはっきりしたものだけ個別に扱う。",
  c:[C("// 挙動は examples/05-errors で CI 確認（SoftHSM2 2.6.1）"),C("// 根拠：Base v2.40「Function return values」"),C("//   と各関数の「Return values」")]};

const svgEl=document.getElementById('svg');
let step=1;
function lightUp(){
  const st=step===0?{k:[],lit:{}}:STEPS[step-1];
  svgEl.querySelectorAll('.row').forEach(r=>{const m=st.lit[r.dataset.a];r.classList.remove('lit','ok','ng','on');if(m)r.classList.add('lit',m)});
  svgEl.querySelectorAll('.stage').forEach(g=>g.classList.toggle('lit',st.k.includes(g.dataset.k)));
}
runSteps({steps:STEPS, all:ALL, onShow:(cur,all)=>{step=all?0:cur; lightUp()}});
</script>
