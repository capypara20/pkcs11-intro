    <!-- 1. 復号は逆向き -->
    <g data-only="1"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="512" y="376" font-size="13" font-weight="700">復号は逆向き</text>
      <text x="512" y="402" font-size="12.5" class="mono">C_DecryptInit（同じメカニズム・同じパラメータ・鍵）→ C_Decrypt（暗号文 → 平文）</text><text x="512" y="428" font-size="12" class="mut">cryptoki の encrypt / decrypt は、Init と本体を続けて呼ぶ</text></g>

    <!-- 2. 鍵を作る -->
    <g data-only="2"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="13" class="mono brass">C_GenerateKey(CKM_AES_KEY_GEN)</text>
      <text x="512" y="402" font-size="12" class="mono">CKA_VALUE_LEN = 32, CKA_ENCRYPT = TRUE, CKA_DECRYPT = TRUE,</text>
      <text x="512" y="422" font-size="12" class="mono">CKA_SENSITIVE = TRUE, CKA_EXTRACTABLE = FALSE</text>
      <text x="512" y="450" font-size="12" class="mono wr">CKA_ENCRYPT のない鍵で暗号化 → CKR_KEY_FUNCTION_NOT_PERMITTED</text></g>

    <!-- 3. 方式とパラメータ -->
    <g data-only="3"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="13" font-weight="700">メカニズムが方式を決め、方式ごとにパラメータが違う</text>
      <text x="512" y="400" font-size="12" class="mono cy">CKM_AES_ECB</text><text x="512" y="417" font-size="12" class="mono cy">CKM_AES_CBC / _PAD</text><text x="512" y="434" font-size="12" class="mono cy">CKM_AES_GCM</text><text x="512" y="451" font-size="12" class="mono cy">CKM_RSA_PKCS_OAEP</text>
      <text x="700" y="400" font-size="12">なし</text><text x="700" y="417" font-size="12">IV 16 バイト</text><text x="700" y="434" font-size="12">IV・付随データ・タグの長さ</text><text x="700" y="451" font-size="12">ハッシュと MGF</text></g>

    <!-- 4. ECB と CBC -->
    <g data-only="4"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--warn)"/>
      <text x="36" y="372" font-size="12">同じ 32 バイト（AAAA…）を暗号化</text>
      <text x="36" y="398" font-size="12" class="mono">ECB</text><rect x="80" y="385" width="80" height="22" rx="3" fill="var(--brass)"/><rect x="166" y="385" width="80" height="22" rx="3" fill="var(--brass)"/><text x="254" y="400" font-size="11.5" class="wr">同じ</text>
      <text x="36" y="428" font-size="12" class="mono">CBC</text><rect x="80" y="415" width="80" height="22" rx="3" fill="var(--brass)"/><rect x="166" y="415" width="80" height="22" rx="3" fill="var(--cipher)"/><text x="254" y="430" font-size="11.5" class="cy">違う</text>
      <text x="36" y="454" font-size="11.5" class="mut">ECB は平文の模様が残る</text></g>

    <!-- 5. IV -->
    <g data-only="5"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--cipher)"/>
      <text x="36" y="374" font-size="12" class="wr">同じ IV → 同じ暗号文</text><text x="36" y="396" font-size="11.5" class="mut">（同じ平文を送ったとばれる）</text><text x="36" y="418" font-size="12" class="cy">IV を毎回変える → 違う暗号文</text><text x="36" y="440" font-size="11.5" class="mut">IV は秘密ではない。暗号文と一緒に送る</text></g>

    <!-- 6. パディング -->
    <g data-only="6"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="13" font-weight="700">ブロック暗号は 16 バイト単位</text>
      <text x="512" y="402" font-size="12.5" class="mono wr">CKM_AES_CBC に 9 バイト → CKR_DATA_LEN_RANGE（16 の倍数だけ）</text><text x="512" y="426" font-size="12.5" class="mono cy">CKM_AES_CBC_PAD → 16 バイトに埋めてから暗号化し、復号で取り除く</text><text x="512" y="450" font-size="11.5" class="mut">埋め方は PKCS #7 と同じ（足りないバイト数の値で埋める）</text></g>

    <!-- 7. CBC は改ざんに気づかない -->
    <g data-only="7"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--warn)"/>
      <text x="36" y="374" font-size="12">IV を 1 ビット変えて復号すると</text><text x="36" y="396" font-size="13" class="mono wr">→ "iello hsm"</text><text x="36" y="418" font-size="12" class="wr">エラーにならず、黙って変わる</text><text x="36" y="440" font-size="11.5" class="mut">気づくには GCM か MAC（第3章）</text></g>

    <!-- 8. GCM は改ざんを見つける -->
    <g data-only="8"><rect class="box" x="24" y="350" width="262" height="112" rx="6" fill="var(--panel2)" stroke="var(--cipher)"/>
      <text x="36" y="374" font-size="12" class="cy">暗号文を 1 ビット変える → 復号エラー</text><text x="36" y="396" font-size="12" class="cy">付随データを変える → 復号エラー</text><text x="36" y="418" font-size="11.5" class="mut">（SoftHSM2 は CKR_GENERAL_ERROR）</text><text x="36" y="440" font-size="12" class="wr">同じ鍵で IV を使い回さないこと</text></g>

    <!-- 9. 分けて渡す -->
    <g data-only="9"><rect class="box" x="316" y="150" width="152" height="146" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="324" y="172" font-size="12" class="mono cy">① C_EncryptInit</text><text x="324" y="193" font-size="12" class="mono cy">② C_EncryptUpdate</text><text x="324" y="214" font-size="11" class="mut">　出力 0 バイトのことも</text><text x="324" y="235" font-size="12" class="mono cy">③ C_EncryptFinal</text><text x="324" y="256" font-size="11" class="mut">　残りを出す</text><text x="324" y="277" font-size="11">→ 一度に渡したときと同じ</text></g>

    <!-- 10. 公開鍵で暗号化 -->
    <g data-only="10"><rect class="box" x="498" y="352" width="680" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="512" y="376" font-size="13" font-weight="700">暗号化は公開鍵（誰でも）、復号は秘密鍵（トークンの中だけ）</text>
      <text x="512" y="400" font-size="12">2048 ビット・SHA-1 なら 214 バイトまで。長いデータは AES で暗号化し、その AES 鍵を RSA で包む</text><text x="512" y="422" font-size="11.5" class="mono mut">公開鍵で復号 → CKR_KEY_FUNCTION_NOT_PERMITTED</text><text x="512" y="444" font-size="11.5" class="mono mut">SHA-256 の OAEP → CKR_ARGUMENTS_BAD（SoftHSM2 2.6.1 は SHA-1 だけ）</text></g>

<script>
const C=code;
const STEPS=[
  {t:"暗号化も2段階で頼む",
   b:"<code>C_EncryptInit</code> でメカニズムと鍵を決め、<code>C_Encrypt</code> で平文を渡すと暗号文が返る。復号は逆向きに <code>C_DecryptInit</code> と <code>C_Decrypt</code>。鍵はトークンの外に出ない。",
   c:["let m = Mechanism::AesCbcPad(iv);","let ct = s.encrypt(&m, key, data)?;","let pt = s.decrypt(&m, key, &ct)?; "+C("// pt == data")],
   k:["data","calls","pipe","key","ct"], v:"cbc"},
  {t:"共通鍵は C_GenerateKey で作る",
   b:"AES の鍵は、第1章と同じくテンプレート1つの <code>C_GenerateKey</code> で作る。暗号化に使うなら <code>CKA_ENCRYPT</code>、復号に使うなら <code>CKA_DECRYPT</code>。付いていない鍵で暗号化しようとすると断られる。",
   c:["let key = s.generate_key(&Mechanism::AesKeyGen, &[","    Attribute::ValueLen(32.into()),","    Attribute::Encrypt(true), Attribute::Decrypt(true),","    /* SENSITIVE, EXTRACTABLE */ ])?;"],
   k:["key"], v:"cbc"},
  {t:"メカニズムで方式を選ぶ",
   b:"どう暗号化するか（ECB・CBC・GCM・RSA-OAEP など）はメカニズムで決まり、方式ごとに必要なパラメータが違う。この手順では4つの方式が順に切り替わる。右上で選ぶとそこで止まる。",
   c:["Mechanism::AesEcb                 "+C("// パラメータなし"),"Mechanism::AesCbcPad(iv)          "+C("// IV 16 バイト"),"Mechanism::AesGcm(GcmParams::new(...))"],
   k:["pipe","param"], cycle:["cbc","ecb","gcm","oaep"]},
  {t:"ECB は模様が残る",
   b:"<code>CKM_AES_ECB</code> は 16 バイトごとに独立して暗号化するので、同じ平文ブロックは同じ暗号文ブロックになる。データの暗号化には使わない。",
   c:["let ct = s.encrypt(&Mechanism::AesEcb, key, &[b'A'; 32])?;","ct[..16] == ct[16..]; "+C("// true（模様が残る）")],
   k:["ct"], v:"ecb"},
  {t:"IV は毎回変える",
   b:"CBC や GCM は IV（初期化ベクトル）をパラメータに取る。同じ鍵と同じ IV なら同じ暗号文になるので、IV は暗号化のたびに <code>C_GenerateRandom</code> で作る。IV は秘密ではないので、暗号文と一緒に送ってよい。",
   c:["let iv: [u8; 16] = s.generate_random_vec(16)?","    .try_into().unwrap(); "+C("// C_GenerateRandom"),"s.encrypt(&Mechanism::AesCbcPad(iv), key, data)?;"],
   k:["param"], v:"cbc"},
  {t:"16 バイトにそろえる",
   b:"AES は 16 バイト単位で暗号化する。<code>CKM_AES_CBC</code> は 16 の倍数しか受け付けず、9 バイトだと <code>CKR_DATA_LEN_RANGE</code>。<code>CKM_AES_CBC_PAD</code> なら埋めてから暗号化し、復号で取り除く。",
   c:["s.encrypt(&Mechanism::AesCbc(iv), key, b\"hello hsm\")",C("// → CKR_DATA_LEN_RANGE"),"s.encrypt(&Mechanism::AesCbcPad(iv), key, data)?;",C("// → 16 バイト")],
   k:["ct","pipe"], v:"cbc"},
  {t:"CBC は改ざんに気づかない",
   b:"CBC は暗号化しかしない。IV や暗号文を書き換えられても復号はエラーにならず、平文が黙って変わる。改ざんに気づくには、GCM を使うか、暗号文に MAC（第3章）を付ける。",
   c:["iv[0] ^= 1; "+C("// 1 ビットだけ変える"),"s.decrypt(&Mechanism::AesCbcPad(iv), key, &ct)?;",C("// → \"iello hsm\"（エラーにならない）")],
   k:["param"], v:"cbc"},
  {t:"GCM は改ざんを見つける",
   b:"<code>CKM_AES_GCM</code> は暗号文に 16 バイトのタグを付ける。暗号文や付随データ（暗号化はしないが守りたいヘッダなど）が書き換えられていれば、復号が失敗する。同じ鍵で IV を使い回すと安全性が崩れるので、IV は必ず毎回変える。",
   c:["let p = GcmParams::new(","    &mut iv12, b\"header\", 128.into())?;","let ct = s.encrypt(&Mechanism::AesGcm(p), key, data)?;",C("// 9 → 25 バイト（タグ 16 を含む）")],
   k:["ct","pipe","param"], v:"gcm"},
  {t:"長いデータは分けて渡す",
   b:"<code>C_EncryptUpdate</code> で少しずつ渡し、<code>C_EncryptFinal</code> で残りを受け取る。途中の出力は、ブロックがそろうまで 0 バイトのこともある。つなげれば一度に暗号化したときと同じになる。",
   c:["s.encrypt_init(&Mechanism::AesCbcPad(iv), key)?;","let mut ct = s.encrypt_update(b\"hello \")?; "+C("// 0 バイト"),"ct.extend(s.encrypt_update(b\"hsm\")?);","ct.extend(s.encrypt_final()?);"],
   k:["calls"], v:"cbc"},
  {t:"公開鍵で暗号化する",
   b:"RSA-OAEP は公開鍵で暗号化し、秘密鍵で復号する。暗号化は誰でもできるが、復号はトークンの中の秘密鍵だけ。暗号化できる長さは短い（2048 ビット・SHA-1 なら 214 バイト）ので、長いデータは AES で暗号化し、その AES 鍵を RSA で包む。",
   c:["let p = PkcsOaepParams::new(MechanismType::SHA1,","    PkcsMgfType::MGF1_SHA1, PkcsOaepSource::empty());","let m = Mechanism::RsaPkcsOaep(p);","let ct = s.encrypt(&m, pub_h, data)?; "+C("// 256 バイト")],
   k:["key","key2","pipe","ct"], v:"oaep"}
];
const ALL={t:"全体像",
  b:"暗号化は <code>C_EncryptInit</code> → <code>C_Encrypt</code>、復号は逆向き。方式はメカニズムで選び、IV などのパラメータを渡す。ECB は模様が残り、CBC は改ざんに気づかない。改ざんも見つけたいなら GCM。公開鍵で暗号化するなら RSA-OAEP。",
  c:[C("// この章の関数・メカニズムは v2.40 で定義済み"),C("// 挙動は examples/04-crypt で CI 確認（SoftHSM2 2.6.1）")]};

const svgEl=document.getElementById('svg'), stageEl=document.getElementById('stage');
let cycle=null, step=1;
function setV(v){
  svgEl.dataset.v=v;
  svgEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));
}
function lightUp(){
  const ks=(step===0?[]:STEPS[step-1].k)||[];
  svgEl.querySelectorAll('[data-k]').forEach(g=>g.classList.toggle('lit',ks.includes(g.dataset.k)));
}
function stopCycle(){clearInterval(cycle);cycle=null}
svgEl.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{stopCycle();setV(c.dataset.v)});
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();stopCycle();setV(c.dataset.v)}});
});
runSteps({
  steps:STEPS, all:ALL,
  onShow:(cur,all)=>{
    stopCycle(); step=all?0:cur; lightUp();
    if(all)return;
    const st=STEPS[cur-1];
    if(st.v)setV(st.v);
    if(st.cycle){
      setV(st.cycle[0]); let i=0;
      cycle=setInterval(()=>{if(!stageEl.classList.contains('paused')){i=(i+1)%st.cycle.length;setV(st.cycle[i])}},3500);
    }
  }
});
</script>
