<script>
const C=code;
// オブジェクトの種類ボタン：押すとその種類のテンプレートと例の箱に切り替える。CKO_SECRET_KEY は本題の AES の例
// 手順3では種類を自動で順に切り替える（押すか一時停止で止まる）
const svgEl=document.getElementById('svg'), stageEl=document.getElementById('stage');
const ORDER=['secret','data','cert','pub','priv'];
let cycle=null, curCls='secret';
function pick(cls){
  curCls=cls;
  const step=+svgEl.dataset.cur||0;
  svgEl.querySelectorAll('.alt').forEach(g=>{const on=g.dataset.cls===cls;g.classList.toggle('shown',on);g.setAttribute('aria-hidden',!on)});
  // AES のテンプレートは手順4以降なら図の本体にあるので、手順2・3のときだけ重ねる
  svgEl.querySelectorAll('.alt-t').forEach(g=>{const on=g.dataset.cls===cls&&(cls!=='secret'||(step>=2&&step<=3));g.classList.toggle('shown',on);g.setAttribute('aria-hidden',!on)});
  svgEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.cls===cls));
}
function stopCycle(){clearInterval(cycle);cycle=null}
function startCycle(){
  stopCycle();
  cycle=setInterval(()=>{if(!stageEl.classList.contains('paused'))pick(ORDER[(ORDER.indexOf(curCls)+1)%ORDER.length])},3500);
}
svgEl.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{stopCycle();pick(c.dataset.cls)});
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();stopCycle();pick(c.dataset.cls)}});
});
runSteps({
  steps:[
    {t:"オブジェクトは属性の集まり",
     b:"トークンの中身はすべてオブジェクト。オブジェクトは「属性（<code>CKA_*</code>）と値」の組の集まりで、それ以外の中身はない。鍵の値も <code>CKA_VALUE</code> という属性の1つにすぎない。",
     c:[C("// 属性は「型」と「値」の組"),"Attribute::Label(\"ch1-sealed\".into())",C("// = CKA_LABEL と、そのバイト列")]},
    {t:"CKA_CLASS が種類を決める",
     b:"どの種類のオブジェクトかは <code>CKA_CLASS</code> で決まる。データ・証明書・公開鍵・秘密鍵・共通鍵などがあり、種類によって持てる属性が変わる。AES の鍵は共通鍵 <code>CKO_SECRET_KEY</code>。図の上の種類を押すと、その種類のテンプレートとオブジェクトの例に切り替わる。",
     c:["Attribute::Class(ObjectClass::SECRET_KEY)",C("// CKA_CLASS = CKO_SECRET_KEY")]},
    {t:"種類が変われば、書くことも変わる",
     b:"どの属性を持つかは種類で決まる。仕様は属性を層に分けて定義していて、上の Object・Storage は共通、下の層が種類ごとに入れ替わる。この手順では種類が順に切り替わり、左にテンプレート、右にできるオブジェクトが出る。種類を押すとそこで止まる。",
     c:["session.create_object(&template)?;",C("// データ・証明書：CKA_CLASS も自分で書く"),"session.generate_key_pair(","    &mech, &pub_t, &priv_t)?;",C("// 鍵ペア：公開鍵側と秘密鍵側の2つ")]},
    {t:"テンプレートで注文する",
     b:"作るときは、ほしい属性を並べた配列（テンプレート）と、作り方（メカニズム）を渡す。AES 鍵なら <code>CKM_AES_KEY_GEN</code> で、鍵長は <code>CKA_VALUE_LEN</code> で指定する。",
     c:["let template = [Attribute::Token(false),","    Attribute::Label(\"ch1-sealed\".into()),","    Attribute::ValueLen(32.into()),","    Attribute::Sensitive(true),","    Attribute::Extractable(false), /* ... */];"]},
    {t:"C_GenerateKey で作る",
     b:"テンプレートに書いた属性は、そのとおりに設定される。<code>CKA_CLASS</code> と <code>CKA_KEY_TYPE</code> は書いていないが、メカニズムが決める。",
     c:["let key = a.generate_key(","    &Mechanism::AesKeyGen, &template)?;",C("// C_GenerateKey(CKM_AES_KEY_GEN)")]},
    {t:"残りはトークンが埋める",
     b:"鍵の値 <code>CKA_VALUE</code> はトークンが作る。<code>CKA_LOCAL</code>（トークン内で生成した）や <code>CKA_ALWAYS_SENSITIVE</code> のように、アプリには書けず、トークンが事実を記録する属性もある。",
     c:["a.get_attributes(key,","    &[AttributeType::Local])?;",C("// → Local(true)")]},
    {t:"アプリに返るのはハンドル",
     b:"アプリが受け取るのは、オブジェクトを指す番号（ハンドル）だけ。鍵の値はトークンの外に出ない。番号そのものに意味はないので、値を当てにしない。",
     c:["println!(\"{key}\");",C("// → 3。鍵の値ではなく番号")]},
    {t:"読める属性・読めない属性",
     b:"属性は <code>C_GetAttributeValue</code> で、型を指定して1つずつ読む。<code>CKA_SENSITIVE=TRUE</code> または <code>CKA_EXTRACTABLE=FALSE</code> の鍵では、値を求めると <code>CKR_ATTRIBUTE_SENSITIVE</code> が返る。",
     c:["a.get_attribute_info(key,","    &[AttributeType::Value])?;",C("// → Sensitive（CKR_ATTRIBUTE_SENSITIVE）")]},
    {t:"守りの属性は一方通行",
     b:"ラベルなど、あとから <code>C_SetAttributeValue</code> で変えられる属性もある。ただし <code>CKA_SENSITIVE</code> は FALSE→TRUE、<code>CKA_EXTRACTABLE</code> は TRUE→FALSE の向きにしか変えられない。一度封じた鍵は元に戻せない。",
     c:["a.update_attributes(key,","    &[Attribute::Sensitive(false)])",C("// → CKR_ATTRIBUTE_READ_ONLY")]},
    {t:"セッションオブジェクトは消える",
     b:"<code>CKA_TOKEN=FALSE</code>（既定値）で作るとセッションオブジェクトになる。同じアプリの別のセッションからも使えるが、作ったセッションを閉じると消える。<code>TRUE</code> ならトークンに残る。",
     c:["a.close()?;",C("// A が作ったセッションオブジェクトは消える"),C("// B から検索しても 0 件")]},
    {t:"検索もテンプレート",
     b:"<code>C_FindObjects</code> の検索条件もテンプレート。書いた属性がすべて一致するオブジェクトのハンドルが返る。空のテンプレートなら、見えるものすべてが返る。",
     c:["b.find_objects(&[","    Attribute::Class(ObjectClass::SECRET_KEY),","    Attribute::KeyType(KeyType::AES)])?;",C("// 全部一致したものだけ")]}
  ],
  onShow:(cur,all)=>{stopCycle();pick('secret');if(cur===3&&!all)startCycle()},
  all:{t:"全体像",
    b:"オブジェクトは属性の集まり。アプリはテンプレートで属性を指定して作り、残りはメカニズムとトークンが埋める。アプリが持つのはハンドルだけで、<code>CKA_SENSITIVE</code> などの属性が「何を読ませ、何を変えさせるか」を決める。各属性の詳細は属性リファレンスへ。",
    c:[C("// この章の関数と属性はすべて v2.40 で定義済み"),C("// v3.0 / v3.1 でも使い方は同じ"),C("// 挙動は examples/01-objects で CI 確認"),C("// 根拠：Base v2.40「Objects」の章")]}
});
</script>
