<script>
const C=code;
const STEPS=[
  {t:"ライブラリを読み込む",
   b:"最初の一歩は、Cryptoki ライブラリ（.so）を読み込んで <code>C_GetFunctionList</code> を呼ぶこと。返ってくるのは関数ポインタを並べた表（<code>CK_FUNCTION_LIST</code>）で、このあとの関数はすべてこの表から呼ぶ。v3.0 以降のライブラリは <code>C_GetInterface</code> も持ち、cryptoki はそちらを先に探す。cryptoki の <code>Pkcs11::new</code> の中でも同じことが起きている。",
   c:["let raw = unsafe { cryptoki_sys::Pkcs11::new(path)? }; "+C("// dlopen"),"unsafe { raw.C_GetFunctionList(&mut list) } "+C("// CKR_OK"),C("// 表には 68 個の関数（v2.40）")],

  {t:"初期化して HSM を用意する",

   c:["lib.initialize(CInitializeArgs::new(OS_LOCKING_OK))?;","let slot_a = prepare(&lib, \"hsm-a\")?; "+C("// InitToken + InitPIN"),"let a = lib.open_rw_session(slot_a)?;","a.login(UserType::User, Some(&pin))?;"],

  {t:"名前を決めて鍵を作る",

   c:["a.generate_key_pair(&EccKeyPairGen, &pub_t, &[","    Token(true), Sensitive(true),","    Extractable(true), Sign(true), label(\"orders-sign\")])?;","a.update_attributes(h, &[Id(sha1(ec_point))])?;"],

  {t:"鍵を使う",

   c:["let sealed = a.encrypt(&AesGcm(params), data_key, DATA)?; "+C("// 36 バイト"),"let hash = a.digest(&Mechanism::Sha256, DATA)?;","let sig = a.sign(&Mechanism::Ecdsa, sign_priv, &hash)?; "+C("// 64 バイト")],
   k:["a-priv","a-data"]},
  {t:"証明書を作る",
   b:"PKCS#11 には証明書を作る関数がない。証明書の中身（TBS：主体・公開鍵・期間・シリアル番号など）はアプリが組み立て、署名だけを HSM-A に頼む。ここでは rcgen に「署名だけ外でやる鍵」を渡し、その中で <code>C_Digest</code> と <code>C_Sign</code> を呼ぶ。ECDSA の署名は r と s を並べた 64 バイトなので、証明書に入れる DER に直す。できた証明書は openssl でも検証できた。",
   c:["impl SigningKey for HsmSigner<'_> {","    fn sign(&self, msg: &[u8]) -> … {","        let h = self.s.digest(&Sha256, msg)?;","        der_sig(&self.s.sign(&Ecdsa, self.key, &h)?)","} }","let cert = params.self_signed(&signer)?;"],

  {t:"証明書をトークンに入れる",

   c:["a.create_object(&[Class(CERTIFICATE),","    CertificateType(X_509), Token(true),","    Id(sign_id), Subject(subject), Value(cert_der),","    label(\"orders-sign\")])?;"],

  {t:"ID で探す",

   c:["a.find_objects(&[Attribute::Id(sign_id)])? "+C("// 3 件"),"a.find_objects(&[Id(sign_id), Class(CERTIFICATE)])? "+C("// 1 件")],

  {t:"移す準備：受け取り用の鍵",

  {t:"包む（C_WrapKey）",

   c:["let w1 = a.wrap_key(&oaep, recv_in_a, carrier)?; "+C("// 256 バイト"),"let w2 = a.wrap_key(&AesKeyWrapPad, carrier, sign_priv)?;","let w3 = a.wrap_key(&AesKeyWrap, carrier, data_key)?; "+C("// 40 バイト"),"a.wrap_key(&AesKeyWrap, carrier, stuck) "+C("// → CKR_KEY_UNEXTRACTABLE")],
   k:["a-car","a-priv","a-data","a-stuck","a-recv"]},
  {t:"ほどく（C_UnwrapKey）",

   c:["let car = b.unwrap_key(&oaep, recv_priv, &w1, &aes_t)?;","let priv_b = b.unwrap_key(&AesKeyWrapPad, car, &w2, &[","    Class(PRIVATE_KEY), KeyType(EC), Token(true),","    Sign(true), Id(sign_id), label(\"orders-sign\"), …])?;"],

  {t:"移った先で確かめる",

   c:["b.decrypt(&AesGcm(params), data_b, &sealed)? "+C("// 元のデータ"),"let sig_b = b.sign(&Ecdsa, priv_b, &hash)?;","a.verify(&Ecdsa, sign_pub, &hash, &sig_b)?; "+C("// 通る"),C("// openssl dgst -sha256 -verify pub.pem … → Verified OK")],
   k:["b-priv","b-data","b-cert"]},
  {t:"元を消す",
   b:"HSM-A の orders-sign（公開鍵・秘密鍵・証明書）と orders-data を <code>C_DestroyObject</code> で消す。HSM-A で ID を探すと 0 件、HSM-B では 3 件。運搬用の鍵や受け取り用の公開鍵はセッションオブジェクトなので、セッションを閉じれば消える。",
   c:["for h in a.find_objects(&[Id(sign_id)])? {","    a.destroy_object(h)?; "+C("// C_DestroyObject"),"}","a.find_objects(&[Id(sign_id)])? "+C("// 0 件")],
   k:["a-pub","a-priv","a-data","a-cert"]},
  {t:"後片付け",
   b:"最後は逆順に片付ける。<code>C_Logout</code>、<code>C_CloseSession</code>、そして <code>C_Finalize</code> でライブラリを手放す。鍵の一生のうち、HSM-A で生まれた鍵は HSM-B に移り、HSM-A からは消えた。",
   c:["a.logout()?; b.logout()?;","a.close()?; b.close()?; "+C("// セッションオブジェクトも消える"),"lib.finalize()?; "+C("// C_Finalize")],
   k:[]}
];
const ALL={t:"全体像",
  b:"ライブラリを読み込んで関数の表を受け取り（<code>C_GetFunctionList</code>）、初期化して HSM を用意し、名前を決めて鍵を作り、使い、証明書を作り、ID で探し、包んで別の HSM へ移し、確かめて、元を消す。移すには作るときから <code>EXTRACTABLE=TRUE</code> が要り、移した鍵からは「ずっと HSM の中にいた」という印が消える。",
  c:[C("// 全手順を examples/s1-lifecycle で CI 確認"),C("// 証明書と署名は openssl でも検証"),C("// 根拠：Base v2.40「Key management functions」"),C("//   C_WrapKey / C_UnwrapKey、Mechanisms v2.40「AES Key Wrap」")]};

const svgEl=document.getElementById('svg');
function inRange(r,n){return r.split(' ').some(p=>{const [a,b]=p.split('-').map(Number);return n>=a&&n<=(b||a)})}
function update(cur,all){
  const k=all?[]:STEPS[cur-1].k;
  svgEl.querySelectorAll('[data-k]').forEach(g=>g.classList.toggle('lit',k.includes(g.dataset.k)));
  svgEl.querySelectorAll('.alt[data-r]').forEach(g=>g.classList.toggle('shown',all?g.dataset.all==='1':inRange(g.dataset.r,cur)));
  svgEl.querySelectorAll('.ph').forEach(g=>{const on=!all&&inRange(g.dataset.r,cur);g.classList.toggle('on',on);
    const last=Math.max(...g.dataset.r.split(' ').map(Number));g.classList.toggle('done',!all&&!on&&last<cur)});
}
runSteps({steps:STEPS, all:ALL, onShow:update});
</script>
