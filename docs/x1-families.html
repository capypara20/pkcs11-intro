    <!-- 6. ショアのアルゴリズム -->
    <g data-only="6">
      <rect x="10" y="456" width="1180" height="134" rx="6" fill="var(--panel)" stroke="var(--warn)"/>
      <text x="28" y="482" font-size="14" font-weight="700" class="wr">ショアのアルゴリズム（量子計算機で動く解き方）</text>
      <text x="28" y="508" font-size="13">素因数分解を解く</text><text x="250" y="508" font-size="13" class="wr">→ RSA が破られる</text>
      <text x="28" y="532" font-size="13">離散対数を解く</text><text x="250" y="532" font-size="13" class="wr">→ Weierstrass・Edwards・Montgomery の楕円曲線がすべて破られる</text>
      <text x="28" y="558" font-size="12.5" class="cy">Ed25519・X25519 は速さや実装のしやすさの改良。土台は同じ離散対数なので、量子への強さは変わらない</text>
      <text x="28" y="580" font-size="11.5" class="mut">この段は仕様書の外の、暗号理論の一般的な話。PKCS#11 の仕様は量子計算機への強さを定めていない</text>
    </g>

    <!-- 7. 名前の読み方 -->
    <g data-only="7">
      <rect x="10" y="456" width="1180" height="134" rx="6" fill="var(--panel)" stroke="var(--cipher)"/>
      <text x="28" y="482" font-size="14" font-weight="700">名前の読み方：「土台」＋「使い道」</text>
      <text x="28" y="510" font-size="13" class="mono brass">ML</text><text x="80" y="510" font-size="13">Module-Lattice（モジュール格子）… 土台の数学の名前。アルゴリズムの名前ではない</text>
      <text x="28" y="534" font-size="13" class="mono brass">KEM</text><text x="80" y="534" font-size="13">Key Encapsulation Mechanism（鍵カプセル化）… 使い道の名前</text>
      <text x="28" y="558" font-size="13" class="mono brass">DSA</text><text x="80" y="558" font-size="13">Digital Signature Algorithm … 署名</text>
      <text x="610" y="558" font-size="13" class="mono brass">SLH</text><text x="662" y="558" font-size="13">StateLess Hash-based … 状態を持たないハッシュ署名</text>
      <text x="28" y="582" font-size="11.5" class="mut">NIST の標準 FIPS 203（ML-KEM）・FIPS 204（ML-DSA）・FIPS 205（SLH-DSA）を、PKCS#11 v3.2 がメカニズムとして取り込んだ</text>
    </g>

    <!-- 8. ML-DSA のメカニズム3つ -->
    <g data-only="8">
      <rect x="10" y="456" width="386" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="26" y="480" font-size="13" class="mono brass">CKM_ML_DSA</text>
      <text x="26" y="506" font-size="12.5">データをそのまま渡す</text>
      <text x="26" y="528" font-size="12.5">ハッシュは ML-DSA の中で行う（SHAKE256）</text>
      <text x="26" y="550" font-size="12" class="mut">分けて渡す（C_SignUpdate）もできる</text>
      <rect x="407" y="456" width="386" height="110" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="423" y="480" font-size="13" class="mono brass">CKM_HASH_ML_DSA</text>
      <text x="423" y="506" font-size="12.5">ハッシュ済みの値を渡す（HashML-DSA）</text>
      <text x="423" y="528" font-size="12.5">使ったハッシュはパラメータで伝える</text>
      <text x="423" y="550" font-size="12" class="mut">1 回で渡す形だけ（第7章の CKM_ECDSA と同じ立場）</text>
      <rect x="804" y="456" width="386" height="110" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="820" y="480" font-size="13" class="mono brass">CKM_HASH_ML_DSA_SHA256 など</text>
      <text x="820" y="506" font-size="12.5">データを渡し、ハッシュもトークンで</text>
      <text x="820" y="528" font-size="12.5">SHA-2・SHA-3・SHAKE の 10 通り</text>
      <text x="820" y="550" font-size="12" class="mut">第7章の CKM_SHA256_RSA_PKCS と同じ立場</text>
      <text x="26" y="586" font-size="12.5">ML-DSA と HashML-DSA は署名の作り方が違う。検証も、署名したときと同じ種類のメカニズムで行う</text>
    </g>

    <!-- 9. SLH-DSA と状態ありのハッシュ署名 -->
    <g data-only="9">
      <rect x="10" y="456" width="1180" height="134" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="28" y="482" font-size="14" font-weight="700">ハッシュ関数を土台にした署名</text>
      <text x="28" y="508" font-size="13" class="mono cy">SLH-DSA</text><text x="190" y="508" font-size="13">状態なし。パラメータセットは CKP_SLH_DSA_SHA2_128S など 12 通り（SHA2 / SHAKE × 128 / 192 / 256 × S / F）</text>
      <text x="28" y="534" font-size="13" class="mono cy">HSS（v3.1〜）</text><text x="190" y="534" font-size="13">状態あり。署名するたびに秘密鍵の状態が進み、残りの回数を CKA_HSS_KEYS_REMAINING で読める</text>
      <text x="28" y="560" font-size="13" class="mono cy">XMSS（v3.2〜）</text><text x="190" y="560" font-size="13">状態あり（CKK_XMSS・CKK_XMSSMT）</text>
      <text x="28" y="582" font-size="11.5" class="mut">表には状態なしの SLH-DSA だけを載せた</text>
    </g>

    <!-- 10. 強さの決め方 -->
    <g data-only="10">
      <rect x="10" y="456" width="386" height="110" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="26" y="480" font-size="13" font-weight="700">RSA：ビット数</text>
      <text x="26" y="506" font-size="12.5" class="mono cy">CKA_MODULUS_BITS = 2048</text>
      <text x="26" y="530" font-size="12" class="mut">数を選ぶ（第4章）</text>
      <rect x="407" y="456" width="386" height="110" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="423" y="480" font-size="13" font-weight="700">楕円曲線：曲線</text>
      <text x="423" y="506" font-size="12.5" class="mono cy">CKA_EC_PARAMS = P-256 の OID</text>
      <text x="423" y="530" font-size="12" class="mut">曲線を選ぶ。Ed25519・X25519 も同じ属性</text>
      <rect x="804" y="456" width="386" height="110" rx="6" fill="var(--panel)" stroke="var(--brass)"/>
      <text x="820" y="480" font-size="13" font-weight="700">PQC：パラメータセット</text>
      <text x="820" y="502" font-size="12.5" class="mono cy">CKA_PARAMETER_SET = CKP_ML_KEM_768</text>
      <text x="820" y="522" font-size="12">ML-KEM：512 / 768 / 1024</text>
      <text x="820" y="540" font-size="12">ML-DSA：44 / 65 / 87</text>
      <text x="820" y="558" font-size="11.5" class="mono wr">未対応 → CKR_PARAMETER_SET_NOT_SUPPORTED</text>
      <text x="26" y="586" font-size="12.5">どれも<tspan class="brass">公開鍵</tspan>のテンプレートに書く。PQC の秘密鍵のテンプレートには書かない（鍵ペアとしてまとめて作られるため）</text>
    </g>
