    <g data-step="1"><rect class="box" x="10" y="8" width="420" height="372" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="24" y="32" font-size="15" font-weight="700">HSM</text><text x="68" y="32" font-size="11.5" class="mono mut">トークン keystore</text><text x="416" y="32" font-size="11" text-anchor="end" class="cy">鍵の値はここから出ない</text>

      <text x="464" y="194" font-size="11.5" class="mut">ハンドル（そのセッションの間だけの番号）</text>
      <g class="alt" data-r="1"><text x="474" y="216" font-size="11.5" class="mono">kek</text><text x="520" y="216" font-size="11.5">作ったが、番号は覚えておかない</text></g>
      <g class="alt" data-r="2-5"><text x="474" y="216" font-size="11.5" class="mono">kek</text><text x="520" y="216" font-size="11.5">ラベル app-kek で探した番号</text><text x="474" y="238" font-size="11.5" class="mono">dk</text><text x="520" y="238" font-size="11.5">データ鍵を作ったときの番号</text></g>
      <g class="alt" data-r="6"><text x="474" y="216" font-size="11.5" class="wr">前のハンドルは、もう何も指さない</text></g>
      <g class="alt" data-r="7"><text x="474" y="216" font-size="11.5" class="mono">kek</text><text x="520" y="216" font-size="11.5" class="cy">ラベル app-kek で探し直した番号</text></g>
      <g class="alt" data-r="8-9" data-all="1"><text x="474" y="216" font-size="11.5" class="mono">kek</text><text x="520" y="216" font-size="11.5">ラベル app-kek で探し直した番号</text><text x="474" y="238" font-size="11.5" class="mono">dk'</text><text x="520" y="238" font-size="11.5" class="cy">ほどいて返ってきた番号</text></g>
      <g class="alt" data-r="8-9" data-all="1"><g data-k="tpl"><rect class="box" x="462" y="256" width="306" height="112" rx="6" fill="var(--panel2)" stroke="var(--line)"/>
        <text x="474" y="276" font-size="12" font-weight="700">ほどくテンプレート</text>
        <text x="474" y="300" font-size="11.5">CLASS・KEY_TYPE　DB の key_type から</text>
        <text x="474" y="322" font-size="11.5">ENCRYPT・DECRYPT　使い道をここで決める</text>
        <text x="474" y="344" font-size="11.5">SENSITIVE = TRUE・EXTRACTABLE = FALSE</text>
        <text x="474" y="362" font-size="11" class="cy">KEK のテンプレートと同じ値を書く</text></g></g>
    </g>

    <!-- DB -->
    <g data-step="1"><rect class="box" x="800" y="8" width="390" height="372" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <text x="814" y="32" font-size="15" font-weight="700">DB</text><text x="1176" y="32" font-size="11" text-anchor="end" class="mut">HSM の外。消えずに残る</text>
      <g class="alt" data-r="1-4"><text x="995" y="120" font-size="12" text-anchor="middle" class="mut">まだ何もない</text></g>
      <g data-step="5"><g data-k="row"><rect class="box" x="812" y="46" width="366" height="178" rx="6" fill="var(--panel2)" stroke="var(--line)"/>
        <text x="824" y="68" font-size="12" font-weight="700">1 行</text>
        <text x="824" y="94" font-size="11.5" class="mono mut">kek_label</text><text x="940" y="94" font-size="11.5" class="mono">app-kek</text>
        <text x="824" y="118" font-size="11.5" class="mono mut">mechanism</text><text x="940" y="118" font-size="11.5" class="mono">CKM_AES_KEY_WRAP</text>
        <text x="824" y="142" font-size="11.5" class="mono mut">key_type</text><text x="940" y="142" font-size="11.5" class="mono">AES-256</text>
        <text x="824" y="166" font-size="11.5" class="mono mut">wrapped</text><text x="940" y="166" font-size="11.5" class="mono cy">包んだ鍵（40 バイト）</text>
        <text x="824" y="190" font-size="11.5" class="mono mut">iv / ct</text><text x="940" y="190" font-size="11.5" class="mono">暗号文</text>
        <text x="824" y="212" font-size="11" class="mut">鍵の値（平文）と属性は、どこにもない</text></g></g>
      <g class="alt" data-r="5"><text x="995" y="256" font-size="11.5" text-anchor="middle" class="cy">属性は包みに入らないので、</text><text x="995" y="276" font-size="11.5" text-anchor="middle" class="cy">ほどくのに要ることは自分で書いておく</text></g>
      <g class="alt" data-r="6-7"><text x="995" y="256" font-size="11.5" text-anchor="middle" class="cy">残っているのは、この行と</text><text x="995" y="276" font-size="11.5" text-anchor="middle" class="cy">HSM の中の KEK だけ</text></g>
      <g class="alt" data-r="8"><text x="995" y="256" font-size="11.5" text-anchor="middle" class="cy">wrapped を読んで HSM へ渡す</text></g>
    </g>

    <!-- 動きの矢印（その手順のときだけ） -->
    <g data-only="4"><path d="M418,212 C440,212 440,142 460,142" stroke="var(--cipher)" stroke-width="1.8" fill="none" marker-end="url(#ar)" class="flowdash"/><text x="406" y="276" font-size="11" text-anchor="end" class="mono cy">C_WrapKey：値を KEK で包んで外へ</text></g>
    <g data-only="5"><path d="M768,142 C788,142 790,118 810,118" stroke="var(--cipher)" stroke-width="1.8" fill="none" marker-end="url(#ar)" class="flowdash"/></g>
    <g data-only="8"><path d="M1150,224 V396 H220 V372" stroke="var(--cipher)" stroke-width="1.8" fill="none" marker-end="url(#ar)" class="flowdash"/><text x="608" y="412" font-size="11" text-anchor="middle" class="mono cy">C_UnwrapKey（KEK, wrapped, ほどくテンプレート）</text></g>

    <!-- 要点 -->
    <g class="alt" data-r="1"><text x="600" y="452" font-size="13" text-anchor="middle">KEK は一度だけ作ってトークンに残す。アプリは値もハンドルも持ち続けない</text></g>
    <g class="alt" data-r="2"><text x="600" y="452" font-size="13" text-anchor="middle">データ鍵は、包めるように EXTRACTABLE = TRUE で作る。値は SENSITIVE で読めなくしておく</text></g>
    <g class="alt" data-r="3"><text x="600" y="452" font-size="13" text-anchor="middle">暗号化は HSM の中。アプリの手元に来るのは暗号文だけ</text></g>
    <g class="alt" data-r="4"><text x="600" y="452" font-size="13" text-anchor="middle">包みに入るのは鍵の値だけ。付けた属性は入らない</text></g>
    <g class="alt" data-r="5"><text x="600" y="452" font-size="13" text-anchor="middle">DB には、包んだ鍵と、ほどくのに要ること（KEK・メカニズム・鍵の種類）を書く</text></g>
    <g class="alt" data-r="6"><text x="600" y="452" font-size="13" text-anchor="middle">閉じるとデータ鍵は消える。付けた属性もいっしょに消える</text></g>
    <g class="alt" data-r="7"><text x="600" y="452" font-size="13" text-anchor="middle">ハンドルはセッションごとの番号。KEK は毎回ラベルで探す</text></g>
    <g class="alt" data-r="8"><text x="600" y="452" font-size="13" text-anchor="middle">どんな鍵として戻すかは、ほどくテンプレートと KEK の UNWRAP_TEMPLATE で決まる</text></g>
    <g class="alt" data-r="9"><text x="600" y="452" font-size="13" text-anchor="middle">使い終わったら捨てる。次に使うときも DB の行からほどき直す</text></g>
    <g class="alt" data-r="0" data-all="1"><text x="600" y="452" font-size="13" text-anchor="middle">鍵の値は HSM の外に平文で出ない。外に置くのは包んだ鍵と、ほどくのに要ることだけ</text></g>
  </svg>

<script>
const C=code;
const STEPS=[
  {t:"KEK を作る（一度だけ）",
   b:"業務で使う鍵（データ鍵）を DB に置きたい。値をそのまま置くわけにはいかないので、HSM の中の鍵（KEK）で包んで置く。KEK は一度だけ作り、<code>CKA_TOKEN</code> を TRUE にしてトークンに残す。包む・ほどくだけに使い、値は出さない。<code>CKA_UNWRAP_TEMPLATE</code> には「この KEK でほどいた鍵に付ける属性」を書き、<code>CKA_MODIFIABLE</code> を FALSE にしてあとから書き換えられないようにする。EXTRACTABLE = FALSE を決めると、ほどいた鍵はもう包み直せない。KEK を付け替える（シナリオ2）なら、そこまで含めて決める。",
   c:[C("// cryptoki に包みがないので C_GenerateKey を直接呼ぶ"),"CKA_TOKEN = TRUE, CKA_LABEL = \"app-kek\",","CKA_WRAP = CKA_UNWRAP = TRUE,","CKA_ENCRYPT = CKA_DECRYPT = FALSE,","CKA_SENSITIVE = TRUE, CKA_EXTRACTABLE = FALSE,","CKA_MODIFIABLE = FALSE,","CKA_UNWRAP_TEMPLATE = [SENSITIVE = TRUE, EXTRACTABLE = FALSE]"],
   k:["kek"]},
  {t:"データ鍵を作る",
   b:"データ鍵はセッションオブジェクト（<code>CKA_TOKEN</code> = FALSE）で作る。HSM に残すのではなく、包んで外に置くため。包めるのは <code>CKA_EXTRACTABLE</code> が TRUE の鍵だけなので TRUE にする。<code>CKA_SENSITIVE</code> を TRUE にしておけば、<code>C_GetAttributeValue</code> で値を読まれることはない。",
   c:["let kek = find_kek(&s)?; "+C("// ラベルで探す"),"let dk = s.generate_key(&AesKeyGen, &[","    Token(false), ValueLen(32), Encrypt(true), Decrypt(true),","    Sensitive(true), Extractable(true)])?; "+C("// C_GenerateKey")],
   k:["dk"]},
  {t:"データを暗号化する",
   b:"データ鍵で業務のデータを暗号化する（ここでは AES-GCM）。暗号化は HSM の中で行われ、アプリの手元に来るのは IV と暗号文だけ。データ鍵の値はアプリに出ない。",
   c:["let iv = s.generate_random_vec(12)?;","let ct = s.encrypt(&AesGcm(iv, aad), dk, b\"order #2001\")?;",C("// C_Encrypt")],
   k:["dk","ct"]},
  {t:"包む（C_WrapKey）",
   b:"<code>C_WrapKey</code> に KEK とデータ鍵のハンドルを渡すと、データ鍵の<b>値</b>を KEK で暗号化したバイト列が返る。ハンドルを包むのではない。AES Key Wrap（RFC 3394）なら、AES-256 の値 32 バイトに検査用の 8 バイトが付いて 40 バイト。包みに入るのは値だけで、データ鍵に付けた属性は入らない。",
   c:["let wrapped = s.wrap_key(&AesKeyWrap, kek, dk)?;",C("// C_WrapKey → 40 バイト"),C("// 中身は鍵の値だけ。属性は入らない")],
   k:["kek","dk","blob"]},
  {t:"DB に書く",
   b:"包んだ鍵を DB に書く。属性は包みに入っていないので、ほどくときに要ることはここで書いておく。どの KEK で包んだか（ラベル）、どのメカニズムで包んだか、どんな種類・長さの鍵か。KEK を付け替えるなら、KEK の世代も書く（シナリオ2）。書き終えたら、セッションの中のデータ鍵は捨てる。",
   c:["db.push(Row { kek_label: \"app-kek\",","    mechanism: \"CKM_AES_KEY_WRAP\", key_type: \"AES-256\",","    wrapped, iv, ct });","s.destroy_object(dk)?; "+C("// C_DestroyObject")],
   k:["row"]},
  {t:"セッションを閉じる",
   b:"セッションを閉じると、セッションオブジェクトのデータ鍵は消え、データ鍵に付けた属性もいっしょに消える。HSM には「この包みはどんな鍵だったか」という記録は残らない。残るのは、DB の行と、トークンの中の KEK だけ。前のセッションのハンドルは、もう何も指さない。",
   c:["s.close()?; "+C("// C_CloseSession"),C("// 別のセッションで前のハンドルを使うと"),"s.get_attributes(dk, &[Class]) "+C("// → CKR_OBJECT_HANDLE_INVALID")],
   k:["row"]},
  {t:"KEK を探す",
   b:"使う側は、別のセッションを開いてログインし、KEK を探す。ハンドルはセッションごとに振られる番号なので、DB やコードに書いておいても使えない。DB の <code>kek_label</code> を条件にして、毎回 <code>C_FindObjects</code> で探す（第5章）。",
   c:["let found = s.find_objects(&[Class(SECRET_KEY),","    Label(row.kek_label)])?; "+C("// 1 件"),"let kek = found[0];"],
   k:["kek"]},
  {t:"ほどく（C_UnwrapKey）",
   b:"<code>C_UnwrapKey</code> に KEK と包んだ鍵、ほどくテンプレートを渡すと、HSM の中に新しい鍵ができてハンドルが返る。値はアプリに出ない。包みには属性が入っていないので、どんな鍵として戻すか（種類・使い道）はテンプレートに書く。KEK に <code>CKA_UNWRAP_TEMPLATE</code> があれば、ほどいた鍵はその属性に従う。テンプレートに同じ値を書かなくてよいトークンも、書かないと通さないトークンもある（トークン次第）。同じ値を書いておけばどちらでも動き、食い違う値（SENSITIVE = FALSE など）を書くとほどけない。",
   c:["let dk = s.unwrap_key(&AesKeyWrap, kek, &row.wrapped, &[","    Class(SECRET_KEY), KeyType(AES), Token(false),","    Encrypt(true), Decrypt(true),","    Sensitive(true), Extractable(false)])?; "+C("// KEK と同じ値"),C("// SENSITIVE = FALSE を書くと → ほどけない")],
   k:["kek","blob","tpl","dk2"]},
  {t:"使って捨てる",
   b:"ほどいた鍵で暗号文を復号すると、元のデータに戻る。使い終わったら、ほどいた鍵は捨てる。次に使うときも、DB の行から同じ手順でほどき直す。トークンに残っているのは KEK だけ。",
   c:["let pt = s.decrypt(&AesGcm(row.iv, aad), dk, &row.ct)?;",C("// → \"order #2001\""),"s.destroy_object(dk)?;","s.logout()?; s.close()?;"],
   k:["dk2","ct"]}
];
const ALL={t:"全体像",
  b:"KEK を一度だけ作ってトークンに残し、データ鍵は使うたびに作る・ほどく。データ鍵は KEK で包んで DB に置き、DB には包んだ鍵とほどくのに要ること（KEK のラベル・メカニズム・鍵の種類）を書く。包みに入るのは値だけで属性は入らないので、ほどいた鍵の属性は、ほどくテンプレートと KEK の <code>CKA_UNWRAP_TEMPLATE</code> で決める。鍵の値は、HSM の外に平文で出ない。",
  c:[C("// 全手順を examples/s3-keystore で CI 確認"),C("// 根拠：Base v2.40「Key management functions」"),C("//   C_WrapKey / C_UnwrapKey、秘密鍵の属性の表"),C("//   CKA_UNWRAP_TEMPLATE")]};

const svgEl=document.getElementById('svg');
function inRange(r,n){return r.split(' ').some(p=>{const [a,b]=p.split('-').map(Number);return n>=a&&n<=(b||a)})}
function update(cur,all){
  const k=all?[]:STEPS[cur-1].k;
  svgEl.querySelectorAll('[data-k]').forEach(g=>g.classList.toggle('lit',k.includes(g.dataset.k)));
  svgEl.querySelectorAll('.alt[data-r]').forEach(g=>g.classList.toggle('shown',all?g.dataset.all==='1':inRange(g.dataset.r,cur)));
}
runSteps({steps:STEPS, all:ALL, onShow:update});
</script>
