<script>
const C=code;
const STEPS=[
  {t:"1回の呼び出しで2つできる",
   b:"非対称鍵は公開鍵と秘密鍵の組。<code>C_GenerateKeyPair</code> にメカニズムと、テンプレートを2つ（公開鍵側・秘密鍵側）渡すと、トークンの中に2つのオブジェクトができ、ハンドルが2つ返る。",
   c:["let (pub_h, priv_h) = s.generate_key_pair(","    &mech, &pub_template, &priv_template)?;",C("// C_GenerateKeyPair")],
   lit:{}},
  {t:"作れるかはトークンに聞く",
   b:"アルゴリズムはメカニズムで決まる（RSA は <code>CKM_RSA_PKCS_KEY_PAIR_GEN</code>、EC は <code>CKM_EC_KEY_PAIR_GEN</code>）。対応しているか、鍵の大きさの範囲はどこまでかは <code>C_GetMechanismInfo</code> で確かめる。範囲の単位はメカニズムごとに違う。",
   c:["let mi = lib.get_mechanism_info(slot,","    MechanismType::RSA_PKCS_KEY_PAIR_GEN)?;","mi.generate_key_pair();",C("// ↑ CKF_GENERATE_KEY_PAIR が立っているか"),"mi.min_key_size(); mi.max_key_size();"],
   lit:{MECH:"on"}},
  {t:"強さは公開鍵側に書く",
   b:"鍵の強さは公開鍵側のテンプレートに書く。RSA は鍵長 <code>CKA_MODULUS_BITS</code> と公開指数 <code>CKA_PUBLIC_EXPONENT</code>、EC は曲線 <code>CKA_EC_PARAMS</code>（曲線の OID を DER にしたもの）。",
   c:["Attribute::ModulusBits(2048.into()),","Attribute::PublicExponent(vec![1, 0, 1]),",C("// EC なら Attribute::EcParams(P256_OID)")],
   lit:{MODULUS_BITS:"on",PUBLIC_EXPONENT:"on",EC_PARAMS:"on"}, side:"pub"},
  {t:"守りは秘密鍵側に書く",
   b:"秘密鍵側には守りを書く。<code>CKA_PRIVATE</code> でログインした人にしか見せず、<code>CKA_SENSITIVE</code> と <code>CKA_EXTRACTABLE</code> で値を読ませず、持ち出させない。",
   c:["Attribute::Private(true),","Attribute::Sensitive(true),","Attribute::Extractable(false),"],
   lit:{PRIVATE:"on",SENSITIVE:"on",EXTRACTABLE:"on"}, side:"priv"},
  {t:"用途も側ごとに書く",
   b:"用途も側ごとに書く。署名に使うなら秘密鍵に <code>CKA_SIGN</code>、公開鍵に <code>CKA_VERIFY</code>。使わない用途（暗号化・復号など）は付けず、必要なものだけ TRUE にする。",
   c:["// 公開鍵側","Attribute::Verify(true),","// 秘密鍵側","Attribute::Sign(true),"],
   lit:{VERIFY:"on",SIGN:"on"}},
  {t:"CKA_ID で組にしておく",
   b:"公開鍵と秘密鍵は別々のオブジェクトで、トークンが自動で結びつけてはくれない。両方に同じ <code>CKA_ID</code>（と <code>CKA_LABEL</code>）を付けておくと、あとで組として探せる。",
   c:["s.find_objects(&[","    Attribute::Id(vec![0x01])])?;",C("// → 2 件（公開鍵と秘密鍵）")],
   lit:{ID:"on",LABEL:"on"}},
  {t:"値と記録はトークンが作る",
   b:"<code>CKA_CLASS</code> と <code>CKA_KEY_TYPE</code> はメカニズムが決め、鍵の値（RSA の n と d、EC の公開点と秘密値）はトークンが作る。<code>CKA_LOCAL</code> や <code>CKA_ALWAYS_SENSITIVE</code> などの記録もトークンが付ける。",
   c:["s.get_attributes(priv_h,","    &[AttributeType::Local])?;",C("// → Local(true)")],
   lit:{CLASS:"ok",KEY_TYPE:"ok",LOCAL:"ok",ALWAYS_SENSITIVE:"ok",NEVER_EXTRACTABLE:"ok",MODULUS:"ok",PRIVATE_EXPONENT:"ok",EC_POINT:"ok",VALUE:"ok",EC_PARAMS:"priv-ok"}},
  {t:"公開する値・隠す値",
   b:"公開鍵の値は読み出して外に配れる（証明書の申請などに使う）。秘密鍵の d や EC の秘密値は <code>CKR_ATTRIBUTE_SENSITIVE</code> で読めない。RSA の n は公開情報なので、秘密鍵からも同じ値が読める。",
   c:["s.get_attributes(pub_h,","    &[AttributeType::Modulus])?; "+C("// 256 バイト"),"s.get_attribute_info(priv_h,","    &[AttributeType::PrivateExponent])?;",C("// → Sensitive（読めない）")],
   lit:{MODULUS:"ok",EC_POINT:"ok",PRIVATE_EXPONENT:"ng",VALUE:"ng"}},
  {t:"書く場所を間違えると",
   b:"書ける属性は種類ごとに決まっている。秘密鍵側に鍵長を書くと <code>CKR_ATTRIBUTE_TYPE_INVALID</code>（秘密鍵はこの属性を持たない）、必要なものを書き忘れると <code>CKR_TEMPLATE_INCOMPLETE</code> で失敗する。正しい場所は、左上の公開鍵側（青枠）。",
   c:["// 秘密鍵側に ModulusBits を足すと",C("// → CKR_ATTRIBUTE_TYPE_INVALID"),"// 公開鍵側に書き忘れると",C("// → CKR_TEMPLATE_INCOMPLETE")],
   lit:{MODULUS_BITS:"pubt-ok",PUBLIC_EXPONENT:"pubt-ok",EC_PARAMS:"pubt-ok"}},
  {t:"RSA と EC の違いは強さの書き方だけ",
   b:"RSA と EC で違うのは、強さの書き方（鍵長か曲線か）と、トークンが作る値の名前だけ。用途と守りの書き方は同じ。この手順では RSA と EC が交互に切り替わる。右上の RSA / EC を押すとそこで止まる。",
   c:["Mechanism::RsaPkcsKeyPairGen "+C("// RSA"),"Mechanism::EccKeyPairGen     "+C("// EC"),C("// テンプレートの違いは強さの1〜2行だけ")],
   lit:{MODULUS_BITS:"on",PUBLIC_EXPONENT:"on",EC_PARAMS:"on",MECH:"on"}}
];
const ALL={t:"全体像",
  b:"鍵ペアは <code>C_GenerateKeyPair</code> 1回で2つできる。公開鍵側には強さと検証の用途、秘密鍵側には守りと署名の用途を書き、同じ <code>CKA_ID</code> で組にする。値と記録はメカニズムとトークンが作る。Ed25519 などは v3.0 で追加されたメカニズムで、別の章で扱う。",
  c:[C("// この章の関数・メカニズム・属性は v2.40 で定義済み"),C("// 挙動は examples/02-keypair で CI 確認")]};

const svgEl=document.getElementById('svg'), stageEl=document.getElementById('stage');
let cycle=null, step=1;
function lightUp(){
  const lit=(step===0?{}:STEPS[step-1].lit)||{};
  svgEl.querySelectorAll('.row').forEach(r=>{
    const side=r.dataset.side||'';
    let m=lit[r.dataset.a];
    // "priv-ok" のように側を限定した指定
    if(m&&m.includes('-')){const [sd,kind]=m.split('-');m=side.startsWith(sd)?kind:undefined}
    r.classList.remove('lit','ok','ng','on');
    if(m)r.classList.add('lit',m);
  });
}
function setV(v){
  svgEl.dataset.v=v;
  svgEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));
}
function stopCycle(){clearInterval(cycle);cycle=null}
svgEl.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{stopCycle();setV(c.dataset.v)});
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();stopCycle();setV(c.dataset.v)}});
});
runSteps({
  steps:STEPS, all:ALL,
  onShow:(cur,all)=>{
    stopCycle(); step=all?0:cur; lightUp();
    if(cur===10&&!all){
      cycle=setInterval(()=>{if(!stageEl.classList.contains('paused'))setV(svgEl.dataset.v==='rsa'?'ec':'rsa')},3000);
    }
  }
});
</script>
