   k:["priv","sig"], v:"hmac"},
  {t:"ハッシュは鍵なしで頼む",
   b:"ハッシュは <code>C_DigestInit</code>（メカニズムだけ）→ <code>C_Digest</code>（データ）の2段階で、鍵は使わない。結果は標準の SHA-256 と同じ値。長いデータは <code>C_DigestUpdate</code> と <code>C_DigestFinal</code> で分けて渡せる。<code>CKM_ECDSA</code> で署名するときは、ここで作ったハッシュ値を渡す。",
   c:["let h = s.digest(&Mechanism::Sha256, b\"hello hsm\")?;",C("// a26275f6…6005（32 バイト）"),"s.digest_init(&Mechanism::Sha256)?;","s.digest_update(b\"hello \")?; s.digest_update(b\"hsm\")?;","s.digest_final()? == h; "+C("// true")],
   k:["data","calls","pipe","sig"], v:"sha"},
  {t:"乱数はトークンから",
   b:"<code>C_GenerateRandom</code> に長さを渡すと、その長さの乱数が返る。Init もメカニズムも鍵も要らない。呼ぶたびに違う値になる。<code>C_SeedRandom</code> で種を足せるが、対応するかはトークン次第（対応していなければ <code>CKR_RANDOM_SEED_NOT_SUPPORTED</code>）。IV（第6章）や証明書のシリアル番号（シナリオ1）に使う。",
   c:["let r = s.generate_random_vec(32)?; "+C("// C_GenerateRandom"),"r != s.generate_random_vec(32)?; "+C("// true"),"s.seed_random(&seed) "+C("// OK か CKR_RANDOM_SEED_NOT_SUPPORTED")],
   k:["calls","pipe","sig"], v:"rng"}
];
const TRACKS=[
  {id:"sig", name:"公開鍵署名", steps:[1,2,3,4,5,6,7,8,9]},
  {id:"mac", name:"MAC", steps:[1,2,10,11,7]},
  {id:"hash", name:"ハッシュと乱数", steps:[1,2,12,13]}
];
// 線ごとの既定の絵。手順に決まった絵がなければ、その線の絵にそろえる
const TRACK_V={sig:["rsa","ec"],mac:["hmac"],hash:["sha","rng"]};
const ALL={t:"全体像",
  b:"署名は <code>C_SignInit</code>（メカニズムと鍵）→ <code>C_Sign</code>（データ）の2段階で、検証は公開鍵で同じ形に行う。使えるメカニズムはトークン次第、鍵の属性が合わなければ断られる。共通鍵なら同じ関数で MAC になる。ハッシュ（<code>C_Digest</code>）と乱数（<code>C_GenerateRandom</code>）は鍵を使わない。",
  c:[C("// この章の関数・メカニズムは v2.40 で定義済み"),C("// 挙動は examples/07-sign で CI 確認"),C("// 根拠：Base v2.40「Signing and MACing functions」"),C("//   「Functions for verifying signatures and MACs」"),C("//   「Message digesting functions」「Random number generation functions」")]};

const svgEl=document.getElementById('svg'), stageEl=document.getElementById('stage');
let cycle=null, step=1;
function setV(v){
  svgEl.dataset.v=v;
  svgEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));
}
function lightUp(){
  const ks=(step===0?[]:STEPS[step-1].k)||[];
  svgEl.querySelectorAll('[data-k]').forEach(g=>g.classList.toggle('lit',ks.includes(g.dataset.k)));
}
function stopCycle(){clearInterval(cycle);cycle=null}
svgEl.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{stopCycle();setV(c.dataset.v)});
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();stopCycle();setV(c.dataset.v)}});
});
runSteps({
  steps:STEPS, all:ALL, tracks:TRACKS,
  onShow:(cur,all,track)=>{
    stopCycle(); step=all?0:cur; lightUp();
    if(all)return;
    const st=STEPS[cur-1];
    if(st.v)setV(st.v);
    else if(!TRACK_V[track].includes(svgEl.dataset.v))setV(TRACK_V[track][0]);
    if(st.cycle){
      setV(st.cycle[0]); let i=0;
      cycle=setInterval(()=>{if(!stageEl.classList.contains('paused')){i=(i+1)%st.cycle.length;setV(st.cycle[i])}},3500);
    }
  }
});
</script>
</body>
</html>
