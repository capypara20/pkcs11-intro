<script>
const C=code;
const STEPS=[
  {t:"「初期化」は3つある",
   b:"PKCS#11 で「初期化」と呼ばれるものは3つあり、対象もタイミングも違う。<code>C_Initialize</code> はライブラリをこのプロセスで使えるようにするもので、アプリが起動するたびに呼ぶ。<code>C_InitToken</code> はトークンそのものを初期化し（中身はすべて消える）、<code>C_InitPIN</code> は SO が User PIN を決める。あとの2つは、トークンを用意するときの管理の作業。",
   c:["lib.initialize(args)?; "+C("// ① C_Initialize"),"lib.init_token(slot, &so_pin, \"ch6\")?;",C("// ② C_InitToken"),"so_session.init_pin(&user_pin)?;",C("// ③ C_InitPIN")],
   k:["lib","tokB","upin","L1"]},
  {t:"C_Initialize：プロセスで1回",
   b:"<code>C_Initialize</code> にはフラグを渡す。複数のスレッドから呼ぶなら <code>CKF_OS_LOCKING_OK</code>。何も渡さないと「複数のスレッドから同時には呼ばない」という約束になる。2回呼ぶと <code>CKR_CRYPTOKI_ALREADY_INITIALIZED</code>（第5章）。使い終わったら <code>C_Finalize</code>。そのあとなら、もう一度初期化できる。",
   c:["let lib = Pkcs11::new(\"…/libsofthsm2.so\")?;",C("// C_Initialize"),"lib.initialize(CInitializeArgs::new(","    CInitializeFlags::OS_LOCKING_OK))?;",C("// …"),"lib.finalize()?; "+C("// C_Finalize")],
   k:["lib","L1","L7"]},
  {t:"ログインなしで読める情報",
   b:"<code>C_GetInfo</code>（ライブラリ）、<code>C_GetSlotList</code> と <code>C_GetSlotInfo</code>（スロット）、<code>C_GetTokenInfo</code>（トークン）は、セッションもログインも要らない。つながるか、どの版か、トークンがどんな状態かを、最初にここで確かめられる。",
   c:["let info = lib.get_library_info()?; "+C("// C_GetInfo"),"info.cryptoki_version(); "+C("// 2.40"),"info.manufacturer_id(); "+C("// \"SoftHSM\""),"info.library_version(); "+C("// 2.6")],
   k:["lib","slotA","slotB","L2"]},
  {t:"スロットを選ぶ",
   b:"<code>C_GetSlotList</code> は、トークンが入っているスロットだけを返すこともできる。SoftHSM2 には、未初期化のトークンを入れた空きスロットが1つあり、そこにはセッションを開けない（<code>CKR_TOKEN_NOT_RECOGNIZED</code>）。スロット番号は固定ではない（SoftHSM2 は初期化したトークンの番号を次の起動で付け替える）ので、ラベルで探す。",
   c:["lib.get_all_slots()?; "+C("// 2 個"),"lib.get_slots_with_token()?; "+C("// 2 個（未初期化も含む）"),"lib.get_slots_with_initialized_token()?; "+C("// 1 個"),"lib.open_ro_session(empty)",C("// → CKR_TOKEN_NOT_RECOGNIZED")],
   k:["slotA","slotB","L2"]},
  {t:"トークンの状態を読む",
   b:"<code>C_GetTokenInfo</code> のフラグで、トークンが初期化済みか（<code>CKF_TOKEN_INITIALIZED</code>）、User PIN があるか（<code>CKF_USER_PIN_INITIALIZED</code>）、ログインが要るか、乱数を作れるかがわかる。PIN の長さの範囲や、PIN を間違えたときの印（第5章）もここにある。",
   c:["let t = lib.get_token_info(slot)?; "+C("// C_GetTokenInfo"),"t.token_initialized(); "+C("// demo: true / 空き: false"),"t.user_pin_initialized(); "+C("// demo: true / 空き: false"),"t.min_pin_length(); "+C("// 4")],
   k:["slotA","tokB","L2"]},
  {t:"C_InitToken：トークンを初期化する",
   b:"<code>C_InitToken</code> は SO PIN とラベルを決めて、トークンを使える状態にする。初期化済みのトークンにも使えるが、そのときは今の SO PIN が要り、中のオブジェクトと User PIN はすべて消える。そのトークンのセッションが開いていると <code>CKR_SESSION_EXISTS</code>。初期化しただけでは User PIN がないので、User はまだログインできない。",
   c:["lib.init_token(slot, &pin(\"5678\"), \"ch6\")?; "+C("// C_InitToken"),"s.login(UserType::User, Some(&pin(\"1111\")))",C("// → CKR_USER_PIN_NOT_INITIALIZED")],
   k:["tokB"]},
  {t:"SO のログインは R/W だけ",
   b:"SO（Security Officer）はトークンの管理者。SO でログインできるのは R/W セッションからで、同じトークンに R/O セッションが1つでもあると <code>CKR_SESSION_READ_ONLY_EXISTS</code>。SO のログイン中は R/O セッションを開けない（<code>CKR_SESSION_READ_WRITE_SO_EXISTS</code>）。状態は <code>RwSecurityOfficer</code> になる。",
   c:["let rw = lib.open_rw_session(slot)?;","rw.login(UserType::So, Some(&pin(\"5678\")))?;",C("// C_Login(CKU_SO)"),"rw.get_session_info()?.session_state()",C("// → RwSecurityOfficer")],
   k:["st-RWSO","L3","L4"]},
  {t:"C_InitPIN：SO が User PIN を決める",
   b:"SO が <code>C_InitPIN</code> で User PIN を決めると <code>CKF_USER_PIN_INITIALIZED</code> が立ち、User がログインできるようになる。SO は鍵の利用者ではないので、SO のままでは非公開の鍵を作れず（<code>CKR_USER_NOT_LOGGED_IN</code>）、別のセッションから User としてログインすることもできない。",
   c:["rw.init_pin(&pin(\"1111\"))?; "+C("// C_InitPIN（SO だけ）"),"rw.logout()?;","rw.login(UserType::User, Some(&pin(\"1111\")))?;"],
   k:["upin","st-RWSO"]},
  {t:"C_SetPIN：自分の PIN を変える",
   b:"ログイン中の本人が <code>C_SetPIN</code> で自分の PIN を変える（SO なら SO PIN）。トークンに残る変更なので R/W セッションが要り、R/O では <code>CKR_SESSION_READ_ONLY</code>。今の PIN が違えば <code>CKR_PIN_INCORRECT</code>。変えたあとは古い PIN では入れない。",
   c:["rw.set_pin(&pin(\"1111\"), &pin(\"2222\"))?; "+C("// C_SetPIN"),"rw.logout()?;","rw.login(UserType::User, Some(&pin(\"1111\")))",C("// → CKR_PIN_INCORRECT")],
   k:["upin","st-RWU"]},
  {t:"セッションの5つの状態",
   b:"セッションの状態は、R/O か R/W かと、だれがログインしているかの組み合わせで5つ。ログインはトークンごとに1つで、同じアプリのセッションすべてに効く。User でログインすると R/O も R/W も User の状態になり、あとから開いたセッションも User の状態で始まる。<code>C_Logout</code> で全部まとめてログインなしに戻る。",
   c:["rw.login(UserType::User, Some(&pin))?;","(state(&ro)?, state(&rw)?) "+C("// (RoUser, RwUser)"),"rw.logout()?;","(state(&ro)?, state(&rw)?) "+C("// (RoPublic, RwPublic)")],
   k:["st-ROP","st-ROU","st-RWP","st-RWU","st-RWSO","L4","L6"]},
  {t:"R/O セッションでできること",
   b:"R/O セッションでも、鍵を使う操作（署名・暗号化）、乱数、検索、セッションオブジェクトの作成はできる。できないのは、トークンに残る変更（トークンオブジェクトの作成・変更・削除、<code>C_SetPIN</code>）と SO のログイン。鍵を使うだけのアプリなら R/O で足りる。",
   c:["let k = session_key(&ro)?; "+C("// CKA_TOKEN=FALSE なら作れる"),"ro.encrypt(&Mechanism::AesEcb, k, &block)?;","ro.destroy_object(stored)",C("// → CKR_SESSION_READ_ONLY")],
   k:["st-ROP","st-ROU","L3","L5"]},
  {t:"最後のセッションを閉じるとログアウト",
   b:"ログインは、そのトークンのセッションが1つでも残っている間は続く。最後のセッションを閉じるとログアウトされ、次に開いたセッションはログインなしの状態から始まる。cryptoki の <code>Session</code> は drop でも閉じるので、ログインしたセッションを先に捨てないようにする。",
   c:["rw.close()?; "+C("// ro が残っている"),"state(&ro)?; "+C("// RoUser のまま"),"ro.close()?; "+C("// 最後の1つ"),"state(&lib.open_rw_session(slot)?)?;",C("// → RwPublic")],
   k:["st-RWU","st-RWP","L6"]},
  {t:"スレッドごとにセッションを開く",
   b:"<code>CKF_OS_LOCKING_OK</code> で初期化したライブラリは、複数のスレッドから使える。セッションはスレッドごとに開く。cryptoki の <code>Session</code> は別のスレッドへ渡せる（<code>Send</code>）が、2つのスレッドから同時には使えない（<code>Sync</code> でない）。ログインはスレッドをまたいで共有され、スレッドで開いたセッションも User の状態で始まる。",
   c:["let lib = lib.clone(); "+C("// 中身は Arc で共有"),"thread::spawn(move || {","    let s = lib.open_ro_session(slot)?; "+C("// RoUser"),"    s.generate_random_vec(16)","});"],
   k:["app","lib","st-ROU"]}
];
const ALL={t:"全体像",
  b:"「初期化」は3つ。アプリが毎回呼ぶのは <code>C_Initialize</code> で、<code>C_InitToken</code>（SO PIN とラベルを決める。中身は消える）と <code>C_InitPIN</code>（SO が User PIN を決める）はトークンを用意するときの作業。セッションの状態は R/O・R/W とログインの種類で決まり、ログインはそのトークンの最後のセッションを閉じるまで続く。",
  c:[C("// 挙動は examples/06-init で CI 確認（SoftHSM2 2.6.1）"),C("// 根拠：Base v2.40「General-purpose functions」"),C("//   「Slot and token management functions」"),C("//   「Session management functions」")]};

const svgEl=document.getElementById('svg');
function inRange(r,n){return r.split(' ').some(p=>{const [a,b]=p.split('-').map(Number);return n>=a&&n<=(b||a)})}
function update(cur,all){
  const k=all?[]:STEPS[cur-1].k;
  svgEl.querySelectorAll('[data-k]').forEach(g=>g.classList.toggle('lit',k.includes(g.dataset.k)));
  svgEl.querySelectorAll('.alt[data-r]').forEach(g=>g.classList.toggle('shown',all?g.dataset.all==='1':inRange(g.dataset.r,cur)));
}
runSteps({steps:STEPS, all:ALL, onShow:update});
</script>
